<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Evening over the hills — thank you for wandering by">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7C3DC"/>
      <stop offset=".6" stop-color="#EBCFC8"/>
      <stop offset="1" stop-color="#F6E1D3"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="230" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#dusk)"/>
    <circle cx="820" cy="58" r="20" fill="#FBF3E6"/>
    <circle cx="830" cy="52" r="18" fill="#C7C3DC" opacity=".95"/>
    <g fill="#FFFFFF">
      <circle cx="120" cy="40" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="28" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="44" r="1.5"><animate attributeName="opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="22" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="36" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M0 170 Q160 130 340 158 T700 150 T1000 145 L1000 230 L0 230Z" fill="#A9B8A6"/>
    <path d="M0 200 Q240 170 520 192 T1000 186 L1000 230 L0 230Z" fill="#94A893"/>
    <!-- little house with a warm window -->
    <rect x="150" y="136" width="30" height="22" rx="2" fill="#EFE3D6"/>
    <path d="M145 138 L165 120 L185 138Z" fill="#C99A8E"/>
    <rect x="167" y="142" width="7" height="7" fill="#F8D98E"><animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></rect>
    <!-- lanterns on a string -->
    <path d="M620 150 Q700 128 780 146" fill="none" stroke="#8C8279" stroke-width="1"/>
    <g fill="#F8D98E">
      <circle cx="650" cy="143" r="4"><animate attributeName="opacity" values=".55;1;.55" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="137" r="4"><animate attributeName="opacity" values="1;.55;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="141" r="4"><animate attributeName="opacity" values=".55;1;.55" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <!-- fireflies -->
    <g fill="#FFF3C4">
      <circle cx="260" cy="190" r="2"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="200" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="195" r="2"><animate attributeName="opacity" values="0;1;0" dur="4.4s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <text x="500" y="82" font-size="30" font-style="italic" fill="#5E544B">thank you for wandering by</text>
      <text x="500" y="112" font-size="14" letter-spacing="3" fill="#7E7268">THE LANTERNS STAY ON · COME BACK SOON</text>
    </g>
  </g>
</svg>
