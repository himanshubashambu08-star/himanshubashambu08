<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Himanshu Bashambu — I turn boring business problems into AI-powered apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#140c24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff5f9e"/>
      <stop offset="1" stop-color="#7c5cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#ff5f9e" stop-opacity=".45"/><stop offset="1" stop-color="#ff5f9e" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#ffb347" stop-opacity=".4"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="280" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <circle r="220" fill="url(#b1)" cx="170" cy="60">
      <animate attributeName="cx" values="170;260;170" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;120;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="200" fill="url(#b2)" cx="850" cy="230">
      <animate attributeName="cx" values="850;760;850" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;170;230" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="160" fill="url(#b3)" cx="560" cy="-20">
      <animate attributeName="cy" values="-20;40;-20" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="90" cy="220" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="40" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="60" r="1.8"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="40" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="250" r="1.4"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="500" y="78" font-size="16" letter-spacing="6" fill="#c9c4e8" opacity=".85">NAMASTE 🙏  HELLO 👋  SAT SRI AKAL</text>
      <text x="500" y="146" font-size="62" font-weight="800" fill="url(#name)">Himanshu Bashambu</text>

      <g font-size="22" fill="#ffffff">
        <text x="500" y="196" opacity="0">🤖 I build AI agents that work while I sleep
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="16s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="196" opacity="0">📞 I make phones answer themselves
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.25;.29;.46;.5;1" dur="16s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="196" opacity="0">📊 Ex-bookkeeper → now I automate the books
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5;.54;.71;.75;1" dur="16s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="196" opacity="0">🚀 Turning boring business problems into apps
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.75;.79;.96;1" dur="16s" repeatCount="indefinite"/>
        </text>
      </g>

      <text x="500" y="244" font-size="15" fill="#a9a3cf">AI Automation Consultant  ·  Full-Stack Developer  ·  London, Ontario 🇨🇦</text>
    </g>
  </g>
</svg>
