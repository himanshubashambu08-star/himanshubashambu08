<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghar Design Studio</title>
<meta name="description" content="Design your home's interior and exterior in live 3D: layouts, styles, colours, furniture and endless new design ideas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --panel:#ffffff; --ink:#1f1d1a; --muted:#6f6a62; --line:#e6e0d6;
  --accent:#c2643a; --accent-ink:#ffffff; --chip:#f1ece4; --chip-on:#1f1d1a; --chip-on-ink:#fff;
  --shadow:0 6px 24px rgba(40,30,20,.10); --warn:#a4461d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --panel:#1e2026; --ink:#f1eee9; --muted:#a39d94; --line:#2e3038;
    --accent:#e07a4c; --accent-ink:#15161a; --chip:#2a2c33; --chip-on:#f1eee9; --chip-on-ink:#15161a;
    --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark; --warn:#f0a070;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --panel:#1e2026; --ink:#f1eee9; --muted:#a39d94; --line:#2e3038;
  --accent:#e07a4c; --accent-ink:#15161a; --chip:#2a2c33; --chip-on:#f1eee9; --chip-on-ink:#15161a;
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark; --warn:#f0a070;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-left:auto}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600}
.tabs button.on{background:var(--panel);box-shadow:var(--shadow)}
.hbtn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:10px;font-weight:500}
.hbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#panel{width:320px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:6px 16px 24px}
#stage{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#viewer{flex:1;position:relative;min-height:0;touch-action:none}
#viewer canvas{display:block;width:100%;height:100%}
.viewbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:12px;box-shadow:var(--shadow);z-index:2}
.viewbar button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-weight:500;white-space:nowrap}
.viewbar button.on{background:var(--chip-on);color:var(--chip-on-ink)}
#hint{position:absolute;bottom:10px;left:12px;font-size:12px;color:var(--muted);background:var(--panel);padding:5px 9px;border-radius:8px;opacity:.92;pointer-events:none;max-width:calc(100% - 24px)}
#selBox{position:absolute;top:64px;right:12px;width:220px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:12px;z-index:3}
#selBox h5{margin:0 0 8px;font-size:14px}
#selBox .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
#selBox .btns button{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 0}
#ideas{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px 12px;flex:none}
.ideas-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ideas-head h3{margin:0;font-size:14px}
.ideas-head span{color:var(--muted);font-size:12px}
.ideas-head .hbtn{margin-left:auto}
#ideaGrid{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;min-height:40px}
.idea{flex:none;width:168px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--chip);padding:0;text-align:left}
.idea img{display:block;width:100%;height:100px;object-fit:cover;background:#ccc}
.idea div{padding:6px 8px;font-size:12px;line-height:1.3}
.idea b{display:block;font-size:12px}
.idea:hover{outline:2px solid var(--accent)}
.empty{color:var(--muted);font-size:12px;align-self:center}
.sec{padding:12px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--chip);padding:6px 10px;border-radius:999px;font-size:13px}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.sws{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}
.row span:first-child{width:62px;color:var(--muted);font-size:13px}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row output{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.tog{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.grid button span{font-size:18px}
.saved{display:flex;align-items:center;gap:8px;margin:6px 0}
.saved img{width:56px;height:36px;object-fit:cover;border-radius:6px}
.saved button{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:4px 8px;font-size:12px}
.saved .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow .hbtn{flex:1}
#shot{position:fixed;inset:0;background:rgba(10,10,12,.72);display:grid;place-items:center;z-index:20;padding:16px}
#shot .card{background:var(--panel);border-radius:16px;padding:12px;max-width:min(900px,100%);display:flex;flex-direction:column;gap:10px}
#shot img{width:100%;border-radius:10px;display:block}
#shot .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#shot .row2 span{color:var(--muted);font-size:12px;flex:1;min-width:160px}
#info{position:absolute;top:60px;left:12px;font-size:12px;background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:10px;box-shadow:var(--shadow);max-width:calc(100% - 260px);z-index:2}
#refCard{position:absolute;right:12px;bottom:44px;width:180px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:2}
#refCard img{display:block;width:100%;border-radius:8px}
#refCard span{font-size:11px;color:var(--muted);display:block;padding:4px 2px 0}
#refCard button{position:absolute;top:10px;right:10px;border:0;background:var(--panel);border-radius:50%;width:24px;height:24px;font-size:12px}
.note{color:var(--muted);font-size:12px;margin:0 0 8px;line-height:1.45}
.warn{color:var(--warn);font-size:12px;margin:8px 0 0}
.rg{font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.rg:first-child{margin-top:0}
.roomrow{display:flex;gap:6px;margin-top:8px}
.roomrow input,.roomrow select,.plotin input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.hbtn.wide{width:100%;margin-top:8px}
.upl{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.upl.dis{opacity:.6;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.refimg{width:100%;border-radius:10px;margin-top:4px;display:block}
.plotin{display:flex;align-items:center;gap:8px;margin:10px 0}
.plotin input{width:80px;flex:0 1 90px;font-variant-numeric:tabular-nums}
.plotin span{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
.stat{background:var(--chip);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stat span{font-size:11px;color:var(--muted)}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--muted)}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}
@media (max-width:820px){
  body{overflow:auto;height:auto}
  main{display:contents}
  #stage{order:1} #ideas{order:2;border-bottom:1px solid var(--line)} #panel{order:3}
  #hint{font-size:11px}
  #panel{width:100%;border-right:0;border-top:1px solid var(--line);max-height:none;overflow:visible}
  #viewer{height:58vh;flex:none}
  #selBox{top:auto;bottom:44px;right:8px;width:200px}
  #info{top:52px;left:8px;max-width:calc(100% - 16px);font-size:11px}
  #refCard{width:110px;bottom:auto;top:92px;right:8px}
  .ideas-head span{display:none}
  .viewbar{top:8px}
  .viewbar button{padding:6px 8px;font-size:12px}
  header{padding:8px 16px}
  .tabs{margin-left:0}
}
</style>

<body>
<header>
  <div class="brand"><i>⌂</i> Ghar Design Studio</div>
  <nav class="tabs" id="tabs">
    <button data-mode="interior" class="on">🛋️ Interior</button>
    <button data-mode="exterior">🏡 Exterior</button>
  </nav>
  <button class="hbtn" id="btnSave">💾 Save</button>
  <button class="hbtn" id="btnShot">📸 Photo</button>
</header>
<main>
  <aside id="panel"></aside>
  <section id="stage">
    <div id="viewer"><div id="loading">Loading 3D…</div></div>
    <div class="viewbar" id="viewbar">
      <button data-view="orbit" class="on">🧊 3D</button>
      <button data-view="top">📐 Plan</button>
      <button data-view="walk">🚶 Walk</button>
      <button data-view="tour">🔄 Tour</button>
    </div>
    <div id="info"></div>
    <div id="refCard" hidden><img id="refImg" alt="Your reference photo"><button id="refClose" aria-label="Hide reference photo">✕</button><span>Your photo</span></div>
    <div id="selBox" hidden></div>
    <div id="shot" hidden></div>
    <div id="hint"></div>
  </section>
</main>
<section id="ideas">
  <div class="ideas-head">
    <h3>✨ Design ideas</h3><span id="ideasSub">Tap “Show new options” for fresh designs. Tap any card to apply it.</span>
    <button class="hbtn primary" id="btnIdeas">✨ Show new options</button>
  </div>
  <div id="ideaGrid"><div class="empty">No ideas yet.</div></div>
</section>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);

/* ---------------- Renderer / scene ---------------- */
const viewer = $('#viewer');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
viewer.appendChild(renderer.domElement);
$('#loading').remove();

const thumbR = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
thumbR.setSize(336, 200, false);
thumbR.shadowMap.enabled = true;
thumbR.outputColorSpace = THREE.SRGBColorSpace;
thumbR.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
let world = new THREE.Group();
scene.add(world);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 400);
const thumbCam = new THREE.PerspectiveCamera(50, 336 / 200, 0.05, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

function resize() {
  const r = viewer.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewer);

/* ---------------- Helpers ---------------- */
function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
const shade = (c, d) => new THREE.Color(c).offsetHSL(0, 0, d).getStyle();
const G = () => new THREE.Group();

function M(color, o = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: o.r ?? 0.7, metalness: o.m ?? 0, ...(o.x || {}) });
}
function glow(color, intensity) {
  return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, roughness: 0.5 });
}
function mesh(g, geo, mat, x, y, z, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true; g.add(m); return m;
}
const box = (g, w, h, d, mat, x = 0, y = 0, z = 0, cast) => mesh(g, new THREE.BoxGeometry(w, h, d), mat, x, y + h / 2, z, cast);
const rbox = (g, w, h, d, mat, x = 0, y = 0, z = 0, r = 0.04) =>
  mesh(g, new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2.01, h / 2.01, d / 2.01)), mat, x, y + h / 2, z);
const cyl = (g, rt, rb, h, mat, x = 0, y = 0, z = 0, seg = 24) => mesh(g, new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y + h / 2, z);
const sph = (g, r, mat, x, y, z) => mesh(g, new THREE.SphereGeometry(r, 20, 14), mat, x, y, z);

/* ---------------- Procedural textures ---------------- */
const texCache = {};
function baseTex(key, draw, n = 512) {
  if (texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = c.height = n;
  draw(c.getContext('2d'), n);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.userData.cached = true;
  return (texCache[key] = t);
}
function useTex(base, rx, ry) { const t = base.clone(); t.userData.cached = false; t.repeat.set(rx, ry); t.needsUpdate = true; return t; }
function noise(ctx, n, count, alpha, light) {
  for (let i = 0; i < count; i++) {
    ctx.fillStyle = `rgba(${light ? '255,255,255' : '0,0,0'},${Math.random() * alpha})`;
    ctx.fillRect(Math.random() * n, Math.random() * n, 2, 2);
  }
}
const DRAW = {
  wood: c => (ctx, n) => {
    const ph = n / 8;
    for (let row = 0; row < 8; row++) {
      const off = (row % 2) * n / 3;
      for (let x = -off; x < n; x += n * 2 / 3) {
        ctx.fillStyle = shade(c, (Math.random() - 0.5) * 0.08);
        ctx.fillRect(x, row * ph, n * 2 / 3, ph);
        for (let k = 0; k < 7; k++) {
          ctx.strokeStyle = `rgba(0,0,0,${0.04 + Math.random() * 0.06})`; ctx.lineWidth = 1;
          ctx.beginPath(); const yy = row * ph + Math.random() * ph;
          ctx.moveTo(x, yy); ctx.bezierCurveTo(x + n * .2, yy + 3, x + n * .4, yy - 3, x + n * 2 / 3, yy + 1); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.strokeRect(x, row * ph, n * 2 / 3, ph);
      }
    }
  },
  marble: c => (ctx, n) => {
    ctx.fillStyle = c; ctx.fillRect(0, 0, n, n);
    for (let v = 0; v < 16; v++) {
      ctx.strokeStyle = `rgba(110,110,120,${0.08 + Math.random() * 0.2})`; ctx.lineWidth = 0.5 + Math.random() * 2;
      let x = Math.random() * n, y = Math.random() * n; ctx.beginPath(); ctx.moveTo(x, y);
      for (let s = 0; s < 30; s++) { x += (Math.random() - 0.3) * 30; y += (Math.random() - 0.5) * 30; ctx.lineTo(x, y); }
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, n / 2, n / 2); ctx.strokeRect(n / 2, n / 2, n / 2, n / 2);
  },
  tile: c => (ctx, n) => {
    const t = n / 4;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { ctx.fillStyle = shade(c, (Math.random() - 0.5) * 0.04); ctx.fillRect(i * t, j * t, t, t); }
    noise(ctx, n, 3000, 0.05);
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 3;
    for (let i = 0; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(i * t, 0); ctx.lineTo(i * t, n); ctx.moveTo(0, i * t); ctx.lineTo(n, i * t); ctx.stroke(); }
  },
  concrete: c => (ctx, n) => { ctx.fillStyle = c; ctx.fillRect(0, 0, n, n); noise(ctx, n, 9000, 0.12); noise(ctx, n, 4000, 0.1, true); },
  carpet: c => (ctx, n) => { ctx.fillStyle = c; ctx.fillRect(0, 0, n, n); noise(ctx, n, 16000, 0.15); noise(ctx, n, 8000, 0.08, true); },
  brick: c => (ctx, n) => {
    ctx.fillStyle = '#cfc6bb'; ctx.fillRect(0, 0, n, n);
    const bh = n / 16, bw = n / 4;
    for (let r = 0; r < 16; r++) for (let x = -(r % 2) * bw / 2; x < n; x += bw) {
      ctx.fillStyle = shade(c, (Math.random() - 0.5) * 0.12); ctx.fillRect(x + 2, r * bh + 2, bw - 4, bh - 4);
    }
    noise(ctx, n, 5000, 0.12);
  },
  grass: () => (ctx, n) => {
    ctx.fillStyle = '#5f8a3e'; ctx.fillRect(0, 0, n, n);
    for (let i = 0; i < 14000; i++) {
      ctx.strokeStyle = shade('#6b9b45', (Math.random() - 0.5) * 0.2); ctx.lineWidth = 1;
      const x = Math.random() * n, y = Math.random() * n; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.random() * 3 - 1.5, y - 4 - Math.random() * 4); ctx.stroke();
    }
  },
  paving: () => (ctx, n) => {
    const t = n / 6;
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { ctx.fillStyle = shade('#b9b2a6', (Math.random() - 0.5) * 0.1); ctx.fillRect(i * t + 2, j * t + 2, t - 4, t - 4); }
    noise(ctx, n, 4000, 0.1);
  },
  gravel: () => (ctx, n) => {
    ctx.fillStyle = '#d8d2c6'; ctx.fillRect(0, 0, n, n);
    for (let i = 0; i < 9000; i++) { ctx.fillStyle = shade('#cfc8ba', (Math.random() - 0.5) * 0.3); ctx.beginPath(); ctx.arc(Math.random() * n, Math.random() * n, 1 + Math.random() * 2, 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(0,0,0,.08)';
    for (let y = 0; y < n; y += 12) { ctx.beginPath(); ctx.moveTo(0, y); for (let x = 0; x < n; x += 16) ctx.lineTo(x, y + Math.sin(x / 30) * 3); ctx.stroke(); }
  },
  asphalt: () => (ctx, n) => { ctx.fillStyle = '#3b3d42'; ctx.fillRect(0, 0, n, n); noise(ctx, n, 12000, 0.2, true); },
  roof: c => (ctx, n) => {
    const rh = n / 12;
    for (let r = 0; r < 12; r++) for (let x = -(r % 2) * 16; x < n; x += 32) {
      ctx.fillStyle = shade(c, (Math.random() - 0.5) * 0.08 - (r % 2) * 0.02); ctx.fillRect(x, r * rh, 31, rh);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, r * rh + rh - 4, 31, 4);
    }
  },
  slats: c => (ctx, n) => {
    for (let x = 0; x < n; x += 32) { ctx.fillStyle = shade(c, (Math.random() - 0.5) * 0.08); ctx.fillRect(x, 0, 28, n); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x + 28, 0, 4, n); }
  },
};
const tex = (kind, color = '') => baseTex(kind + color, DRAW[kind](color));

function paintingTex(seed, colors) {
  const r = rng(seed); const c = document.createElement('canvas'); c.width = 256; c.height = 180;
  const ctx = c.getContext('2d');
  ctx.fillStyle = pick(r, ['#f3efe7', '#efe6d8', '#e9ecef', '#1f2a33']); ctx.fillRect(0, 0, 256, 180);
  const kind = Math.floor(r() * 3);
  for (let i = 0; i < 7; i++) {

function setRoom(i) {

  buildInterior(); renderPanel(); if (view !== 'walk') frame(camera, controls); else setView('walk');

function addRoom(type) {
  const count = state.rooms.filter(rm => rm.roomType === type).length;
  const rm = newInterior(type, state.interior.style, count ? `${ROOM_LABEL[type]} ${count + 1}` : ROOM_LABEL[type]);
  if (type !== 'bathroom') Object.assign(rm, { wall: state.interior.wall, accent: state.interior.accent, floor: state.interior.floor, floorColor: state.interior.floorColor });
  state.rooms.push(rm); setRoom(state.rooms.length - 1);

}
function copyStyleAll() {

    Object.assign(rm, { style: s.style, lighting: s.lighting, accent: s.accent, accentWall: rm.roomType === 'bathroom' ? rm.accentWall : s.accentWall });
    if (rm.roomType !== 'bathroom') Object.assign(rm, { wall: s.wall, floor: s.floor, floorColor: s.floorColor });

}

    h('input', { type: 'file', id: 'photoIn', accept: 'image/*', class: 'vh', onchange: e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f && !photo.busy) onPhoto(f); } }),
    status,
    p.ref ? h('img', { class: 'refimg', src: p.ref, alt: 'Your reference photo' }) : null);
}
function setPhotoMsg(t) { photo[state.mode].msg = t; const el = $('#photoMsg'); if (el) el.textContent = t; }
function updateRefCard() {
  const card = $('#refCard'), p = photo[state.mode];
  if (!p.ref || card.dataset.closed === state.mode) { card.hidden = true; return; }
  card.hidden = false; $('#refImg').src = p.ref;
}
$('#refClose').onclick = () => { $('#refCard').dataset.closed = state.mode; $('#refCard').hidden = true; };

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    im.src = url;
  });
}
function drawScaled(img, max) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const k = Math.min(1, max / Math.max(iw, ih));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(iw * k)); c.height = Math.max(1, Math.round(ih * k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c;
}
const toBlob = (c, q) => new Promise(res => c.toBlob(res, 'image/jpeg', q));

/* Colour reading: k-means over a 64px thumbnail, then each colour cluster is scored by
   where it sits in the frame (walls high, floor low, sky at the very top, etc.). */
function clusters(canvas, k = 6) {
  const c = drawScaled(canvas, 64), d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data, px = [];
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) { const i = (y * c.width + x) * 4; px.push([d[i] / 255, d[i + 1] / 255, d[i + 2] / 255, y / (c.height - 1)]); }
  const lum = p => 0.299 * p[0] + 0.587 * p[1] + 0.114 * p[2];
  const sorted = [...px].sort((a, b) => lum(a) - lum(b));
  let cent = Array.from({ length: k }, (_, i) => sorted[Math.floor((i + 0.5) / k * sorted.length)].slice(0, 3));
  const lab = new Array(px.length);
  for (let it = 0; it < 10; it++) {
    const sum = cent.map(() => [0, 0, 0, 0]);
    px.forEach((p, i) => {
      let best = 0, bd = 1e9;
      cent.forEach((c2, j) => { const dd = (p[0] - c2[0]) ** 2 + (p[1] - c2[1]) ** 2 + (p[2] - c2[2]) ** 2; if (dd < bd) { bd = dd; best = j; } });
      lab[i] = best; const s = sum[best]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++;
    });
    cent = cent.map((c2, j) => sum[j][3] ? [sum[j][0] / sum[j][3], sum[j][1] / sum[j][3], sum[j][2] / sum[j][3]] : c2);
  }
  const out = cent.map(rgb => { const col = new THREE.Color(rgb[0], rgb[1], rgb[2]), hsl = {}; col.getHSL(hsl); return { rgb, hex: '#' + col.getHexString(), h: hsl.h * 360, s: hsl.s, l: hsl.l, n: 0, top: 0, mid: 0, bot: 0, vtop: 0 }; });
  px.forEach((p, i) => { const c2 = out[lab[i]]; c2.n++; if (p[3] < 0.45) c2.top++; else if (p[3] > 0.7) c2.bot++; else c2.mid++; if (p[3] < 0.2) c2.vtop++; });
  return out.filter(c2 => c2.n > px.length * 0.01);
}
const cdist = (a, b) => { const x = new THREE.Color(a), y = new THREE.Color(b); return Math.hypot(x.r - y.r, x.g - y.g, x.b - y.b); };
const argmax = (arr, f) => arr.reduce((best, c) => (best === null || f(c) > f(best) ? c : best), null);

function localInterior(canvas) {
  const cl = clusters(canvas);
  const wall = argmax(cl, c => c.top * (c.l > 0.25 ? 1 : 0.3));
  const rest = cl.filter(c => c !== wall);
  const floorC = argmax(rest, c => c.bot) || wall;
  const rest2 = rest.filter(c => c !== floorC);
  const accentC = argmax(rest2, c => c.s * Math.pow(c.n, 0.3)) || floorC;
  const fabricC = argmax(rest2.filter(c => c !== accentC), c => c.mid) || accentC;
  const f = floorC;
  const floor = f.l > 0.78 && f.s < 0.18 ? 'marble' : (f.h >= 12 && f.h <= 48 && f.s > 0.2 && f.l < 0.72) ? 'wood' : (f.s < 0.08 && f.l < 0.65) ? 'concrete' : 'tile';
  let R = 0, B = 0, Lm = 0, N = 0; cl.forEach(c => { R += c.rgb[0] * c.n; B += c.rgb[2] * c.n; Lm += (0.3 * c.rgb[0] + 0.59 * c.rgb[1] + 0.11 * c.rgb[2]) * c.n; N += c.n; }); R /= N; B /= N; Lm /= N;
  const lighting = Lm < 0.28 ? 'evening' : R - B > 0.08 ? 'warm' : Lm > 0.62 ? 'day' : B > R ? 'cool' : 'warm';
  let style = 'modern', bd = 1e9;
  for (const [k, st] of Object.entries(STYLES)) {
    const d = cdist(wall.hex, st.wall) * 1.2 + cdist(f.hex, st.floorColor) + cdist(accentC.hex, st.accent) * 0.6 + cdist(fabricC.hex, st.fabric) * 0.7 + (st.floor === floor ? 0 : 0.25);
    if (d < bd) { bd = d; style = k; }
  }
  return { style, wall: wall.hex, accent: accentC.hex, accentWall: accentC.s > 0.25 && accentC.top > accentC.n * 0.3, floor, floorColor: f.hex, fabric: fabricC.hex, lighting };
}
function localExterior(canvas) {
  const cl = clusters(canvas, 7);
  const sky = c => (c.h >= 180 && c.h <= 250 && c.s > 0.15 && c.l > 0.45 && c.top > c.n * 0.5) || (c.l > 0.88 && c.vtop > c.n * 0.5);
  const green = c => c.h >= 65 && c.h <= 170 && c.s > 0.15 && c.l < 0.75;
  const cand = cl.filter(c => !sky(c) && !green(c));
  const pool = cand.length ? cand : cl;
  const wall = argmax(pool, c => (c.mid + 0.6 * c.top) * (c.l > 0.35 ? 1 : 0.35));
  const roof = argmax(pool.filter(c => c !== wall), c => c.top * (1 + c.s)) || { hex: shade(wall.hex, -0.35) };
  const trim = argmax(pool.filter(c => c !== wall && c !== roof && c.n > 0), c => 1 - c.l) || { hex: shade(wall.hex, -0.45) };
  let style = 'modern', bd = 1e9;
  for (const [k, st] of Object.entries(EXT_STYLES)) {
    const d = cdist(wall.hex, st.wall) * 1.3 + cdist(roof.hex, st.roofColor) + cdist(trim.hex, st.trim) * 0.6;
    if (d < bd) { bd = d; style = k; }
  }
  return { style, wall: wall.hex, trim: trim.hex, roofColor: roof.hex, roof: EXT_STYLES[style].roof };
}

const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const oneOf = (v, list, fb) => (list.includes(v) ? v : fb);

async function askClaude(blob, isInt) {
  const sample = await samplePromise;
  if (!sample) return { why: 'none' };
  const lim = await sample.limits().catch(() => null);
  if (!lim || !lim.images) return { why: 'none' };
  const prompt = isInt
    ? `The image is a photo of a room. Map what you see to the settings of a 3D room designer so the 3D room looks as close to the photo as possible.
Reply with only a JSON object with exactly these keys:
"roomType": one of ${Object.keys(ROOM_LABEL).join(', ')}
"style": the closest of these style ids: ${Object.entries(STYLES).map(([k, v]) => `${k} (${v.name})`).join(', ')}
"wall": hex colour of the main walls, like "#e9e6e1"
"accentWall": true if one wall clearly has a different colour or material, else false
"accent": hex colour of that feature wall, or of the strongest accent colour
"floor": one of wood, marble, tile, carpet, concrete
"floorColor": hex colour of the floor
"fabric": hex colour of the main sofa, bed or upholstery
"lighting": one of day, warm, evening, cool
"furniture": array of the items visible, using only these ids: ${Object.keys(F).join(', ')}
"summary": one short sentence in simple Hinglish (Hindi written in Latin letters, mixed with English) describing the look.
If the photo is not a room, pick the closest values anyway and say so in the summary.`
    : `The image is a photo of a house or building from outside. Map what you see to the settings of a 3D house designer so the 3D house looks as close to the photo as possible.
Reply with only a JSON object with exactly these keys:
"style": the closest of these style ids: ${Object.entries(EXT_STYLES).map(([k, v]) => `${k} (${v.name})`).join(', ')}
"floors": number of storeys, 1, 2 or 3
"roof": one of flat, gable, hip
"wall": hex colour of the main outside walls
"trim": hex colour of window frames, railings or trim
"roofColor": hex colour of the roof (or parapet for a flat roof)
"balcony": true or false
"porch": true if there is a car porch, garage or parked car area
"pool": true or false
"fence": true if there is a boundary wall or fence
"columns": true if there are verandah or porch columns
"garden": one of lawn, paved, zen
"time": one of day, sunset, night
"summary": one short sentence in simple Hinglish (Hindi written in Latin letters, mixed with English) describing the house.
If the photo is not a house, pick the closest values anyway and say so in the summary.`;
  try {
    const res = await sample.json(prompt, { images: blob });
    return res && typeof res === 'object' ? { res } : { why: 'bad' };
  } catch (e) {
    return { why: e && e.code || 'error' };
  }
}

async function onPhoto(file) {
  const mode = state.mode, isInt = mode === 'interior', p = photo[mode];
  photo.busy = true; renderPanel(); setPhotoMsg('Photo khol raha hoon…');
  try {
    const img = await loadImage(file);
    const big = drawScaled(img, 1400);
    p.ref = big.toDataURL('image/jpeg', 0.8); $('#refCard').dataset.closed = ''; updateRefCard();
    const local = isInt ? localInterior(big) : localExterior(big);
    setPhotoMsg('Claude photo dekh raha hai… (30–60 second lag sakte hain)');
    const blob = await toBlob(big, 0.88);
    const ai = blob ? await askClaude(blob, isInt) : { why: 'none' };
    if (state.mode !== mode) return;
    const res = ai.res || {};
    const via = ai.res ? 'claude' : 'colours';
    if (isInt) applyInteriorPhoto(res, local); else applyExteriorPhoto(res, local);
    const why = { not_granted: ' (Claude ki permission nahi mili, isliye sirf colours se match kiya.)', rate_limited: ' (Claude abhi busy hai, isliye colours se match kiya. Thodi der baad dobara try karo.)', none: '', bad: ' (Claude ka jawab samajh nahi aaya, colours se match kiya.)' }[ai.why] ?? (ai.why ? ' (Claude se jawab nahi mila, colours se match kiya.)' : '');
    const s = isInt ? state.interior : state.exterior, st = isInt ? STYLES[s.style] : EXT_STYLES[s.style];
    const summary = typeof res.summary === 'string' ? ' ' + res.summary.slice(0, 220) : '';
    p.msg = (via === 'claude' ? '✅ Claude ne photo dekh ke design banaya: ' : '✅ Photo ke colours se design banaya: ') + `${st.flag} ${st.name}.` + summary + why +
      (ai.why === 'none' ? ' (Ye sirf colours ka match hai. Furniture aur shape bhi photo jaisa chahiye to hosted app mein photo upload karo, wahan Claude photo dekhta hai.)' : '');
  } catch (e) {
    console.error('photo', e);
    p.msg = 'Ye photo khul nahi payi. JPG ya PNG photo try karo.';
  } finally {
    photo.busy = false; if (state.mode === mode) { renderPanel(); if (view !== 'walk') frame(camera, controls); }
  }
}
function applyInteriorPhoto(res, local) {
  const cur = state.interior;
  const roomType = oneOf(res.roomType, Object.keys(ROOM_LABEL), cur.roomType);
  const style = oneOf(res.style, Object.keys(STYLES), local.style);
  const floor = oneOf(res.floor, Object.keys(FLOORS), local.floor);
  const s = {
    ...cur, roomType, style,
    wall: isHex(res.wall) ? res.wall : local.wall,
    accent: isHex(res.accent) ? res.accent : local.accent,
    accentWall: typeof res.accentWall === 'boolean' ? res.accentWall : local.accentWall,
    floor, floorColor: isHex(res.floorColor) ? res.floorColor : (floor === local.floor ? local.floorColor : FLOORS[floor][0]),
    lighting: oneOf(res.lighting, Object.keys(LIGHT), local.lighting), seed: Math.floor(Math.random() * 1e6),
  };
  if (roomType !== cur.roomType && Object.values(ROOM_LABEL).includes(cur.name)) { const [W, D] = ROOM_DEFAULTS[roomType]; s.W = Math.max(s.W, W * 0.8); s.D = Math.max(s.D, D * 0.8); }
  let items = generateLayout(roomType, s.W, s.D, s.seed);
  const seen = Array.isArray(res.furniture) ? [...new Set(res.furniture.filter(t => typeof t === 'string' && F[t]))] : [];
  if (seen.length >= 2) {
    const keep = items.filter(it => seen.includes(it.type) || it.type === 'wallArt');
    const missing = seen.filter(t => !keep.some(it => it.type === t));
    let k = 0;
    for (const t of missing.slice(0, 6)) { keep.push({ type: t, x: THREE.MathUtils.clamp(-0.8 + (k % 3) * 0.8, -s.W / 2 + 0.5, s.W / 2 - 0.5), z: THREE.MathUtils.clamp(-0.3 + Math.floor(k / 3) * 0.9, -s.D / 2 + 0.5, s.D / 2 - 0.5), rot: 0, seed: Math.floor(Math.random() * 1e6) }); k++; }
    if (keep.length >= 2) items = keep;
  }
  const fabric = isHex(res.fabric) ? res.fabric : local.fabric;
  items.forEach(it => { if (['sofa', 'lsofa', 'armchair', 'bed'].includes(it.type)) it.color = fabric; });
  s.items = items;
  selectedIdx = -1; replaceInterior(s); buildInterior();
}
function applyExteriorPhoto(res, local) {
  const cur = state.exterior;
  const style = oneOf(res.style, Object.keys(EXT_STYLES), local.style), v = EXT_STYLES[style];
  const b = (key, fb) => (typeof res[key] === 'boolean' ? res[key] : fb);
  state.exterior = {
    ...cur, style,
    floors: oneOf(Number(res.floors), [1, 2, 3], cur.floors),
    roof: oneOf(res.roof, ['flat', 'gable', 'hip'], local.roof || v.roof),
    wall: isHex(res.wall) ? res.wall : local.wall, trim: isHex(res.trim) ? res.trim : local.trim, roofColor: isHex(res.roofColor) ? res.roofColor : local.roofColor,
    balcony: b('balcony', cur.balcony), porch: b('porch', cur.porch), pool: b('pool', cur.pool), fence: b('fence', cur.fence), columns: b('columns', !!v.columns),
    garden: oneOf(res.garden, ['lawn', 'paved', 'zen'], cur.garden), time: oneOf(res.time, ['day', 'sunset', 'night'], 'day'),
  };
  buildExterior();
}
$('#btnShot').onclick = () => {
  if (selHelper) selHelper.visible = false;
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  if (selHelper) selHelper.visible = true;
  const sh = $('#shot'); sh.innerHTML = '';
  sh.append(h('div', { class: 'card' }, h('img', { src: url, alt: 'Design photo' }),
    h('div', { class: 'row2' }, h('span', {}, 'Right-click or long-press the image to save or share it.'),
      h('a', { class: 'hbtn primary', href: url, download: `ghar-design-${state.mode}.png`, style: 'text-decoration:none' }, 'Download'),
      h('button', { class: 'hbtn', onclick: () => (sh.hidden = true) }, 'Close'))));
  sh.hidden = false;
};

/* ---------------- Loop ---------------- */
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  walkStep(dt);
  controls.update();
  if (state.mode === 'interior' && view !== 'walk') updateWalls(camera);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
resize(); buildInterior(); renderPanel(); setView('orbit'); loop();
</script>
