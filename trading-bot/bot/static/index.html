<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trade Bot">
<title>Forex Trade Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#F3F5FA;--surface:#FFFFFF;--ink:#141A2B;--muted:#5B6479;--line:#DDE2EC;--gold:#946500;--gold-hi:#C8901A;
 --gold-soft:#FBF1D9;--on-gold:#FFFFFF;--good:#0F7A55;--good-soft:#DDF3EA;--bad:#C2352B;--bad-soft:#FBE4E1;
 --warn:#9A5B00;--warn-soft:#FBEBD3;--up:#0F9D6B;--down:#D64545;--ema:#7C5CD6;--zone:rgba(200,144,26,.18);
 --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
 --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--surface:#141B2E;--ink:#ECEFF7;--muted:#8E98B2;--line:#25304A;
 --gold:#E9B949;--gold-hi:#F7D57E;--gold-soft:#2E2817;--on-gold:#1A1300;--good:#3FD69A;--good-soft:#11291F;
 --bad:#FF7A6E;--bad-soft:#331917;--warn:#F2B35A;--warn-soft:#30230F;--up:#3FD69A;--down:#FF7A6E;--ema:#A58CF0;--zone:rgba(233,185,73,.2)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
.wrap{display:flex;flex-direction:column;gap:12px}
.app{max-width:1100px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 10px;margin:0 0 6px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{font:700 26px/1 var(--f-display);margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--gold)}
.sym{font:500 12px var(--f-num);color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;white-space:nowrap;font:600 14px var(--f-body);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);border-color:transparent;box-shadow:0 4px 14px -6px var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font:700 20px/1.1 var(--f-display);margin:0 0 8px;letter-spacing:.01em}
h3{font:600 15px var(--f-body);margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.num{font-family:var(--f-num)}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-weight:600}
.status .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.status small{display:block;font-weight:500;opacity:.85;font-size:13px}
.status.ok{background:var(--good-soft);color:var(--good)}
.status.open{background:var(--gold-soft);color:var(--gold)}
.status.lock{background:var(--bad-soft);color:var(--bad)}
.daybar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.daybar div{background:var(--surface);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.daybar b{font:500 17px var(--f-num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.daybar{grid-template-columns:repeat(2,1fr)}}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
/* pipeline */
.flow{display:flex;flex-direction:column;gap:0}
.flow .arrow{height:16px;margin-left:27px;border-left:2px dashed var(--line)}
.agent-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.agent-row:hover{border-color:var(--gold)}
.emo{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--bg);border:1px solid var(--line)}
.agent-row .name{font-weight:600}
.agent-row .st{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tone{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted);vertical-align:1px}
.tone.ok{background:var(--good)}.tone.warn{background:var(--warn)}.tone.bad{background:var(--bad)}.tone.idle{background:var(--line)}
.big{font:500 18px var(--f-num);text-align:right}
.big small{display:block;font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.side-note{font-size:12px;color:var(--muted);margin-left:56px;padding:2px 0}
/* agent cards */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.acard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.acard:hover{border-color:var(--gold)}
.acard .head{display:flex;gap:10px;align-items:center}
.plan{background:var(--gold-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13.5px}
.plan b{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.to{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);cursor:pointer}
/* agent detail */
.back{align-self:flex-start;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:600 14px var(--f-body);cursor:pointer}
.hero{display:flex;gap:12px;align-items:center}
.hero .emo{width:56px;height:56px;font-size:28px}
.hero h2{margin:0}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.tl li:first-child{border-top:none}
.tl .t{font:500 12px var(--f-num);color:var(--muted);padding-top:2px}
.tl .to{font-size:12px;color:var(--gold);font-weight:600}
.tl li.good .txt{color:var(--good)}.tl li.bad .txt{color:var(--bad)}.tl li.warn .txt{color:var(--warn)}
.tl li[data-ref]{cursor:pointer}
.tl li[data-ref] .txt::after{content:"  ›";color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* journeys */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 13px var(--f-body);cursor:pointer}
.seg button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.jcard{display:flex;flex-direction:column;gap:8px}
.jhead{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.b-open{background:var(--gold-soft);color:var(--gold)}.b-block{background:var(--warn-soft);color:var(--warn)}
.b-win{background:var(--good-soft);color:var(--good)}.b-loss{background:var(--bad-soft);color:var(--bad)}.b-run{background:var(--bg);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0 0 0 6px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.steps li{position:relative;padding-left:14px;font-size:14px}
.steps li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.steps li.pass::before{border-color:var(--good);background:var(--good)}
.steps li.block::before{border-color:var(--bad);background:var(--bad)}
.steps li.info::before{border-color:var(--gold)}
.steps .who{font-weight:600}
/* charts */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{border-top:4px solid var(--line)}
.ccard.signal{border-top-color:var(--good)}.ccard.forming{border-top-color:var(--gold-hi)}.ccard.watch{border-top-color:#4c7bd9}
canvas{width:100%;height:150px;display:block;margin:6px 0}
canvas.mini{height:110px}
canvas.big{height:min(60vh,420px)}
.ccard a,.jcard a{color:var(--gold);text-decoration:none;font-weight:600}
.live{font-size:12px;color:var(--muted)}.live.on{color:var(--good);animation:glow2 1.2s ease-in-out infinite}
@keyframes glow2{50%{opacity:.25}}
.cbadge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff;background:var(--muted)}
.signal .cbadge{background:var(--good)}.forming .cbadge{background:var(--gold-hi)}.watch .cbadge{background:#4c7bd9}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv b{font-family:var(--f-num);font-weight:500}
details summary{cursor:pointer;font-weight:600}

/* ---- Manager robot ---- */
.app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#robot{position:fixed;left:0;top:0;z-index:20;width:64px;height:76px;padding:0;border:0;background:none;cursor:pointer;
 transition:transform 1.1s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 6px 10px rgba(0,0,0,.28))}
#robot svg{display:block;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
#robot.walking svg{animation:walk .34s ease-in-out infinite}
#robot.walking .leg-l{animation:legs .34s infinite}#robot.walking .leg-r{animation:legs .34s infinite reverse}
#robot.jump svg{animation:jump .45s ease-in-out 3}
#robot .eyes{animation:blink 4.5s infinite;transform-origin:32px 30px;transform-box:view-box}
#robot .glow{animation:glow 1.6s infinite}
#robot[data-mood="good"] .eye{fill:#3FD69A}#robot[data-mood="bad"] .eye{fill:#FF7A6E}#robot[data-mood="warn"] .eye{fill:#F2B35A}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes walk{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-3px)}}
@keyframes legs{50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes glow{50%{opacity:.3}}
@keyframes jump{50%{transform:translateY(-16px)}}
#bubble{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:19;
 width:min(560px,calc(100% - 24px));max-height:52vh;overflow:auto;background:var(--surface);border:1px solid var(--gold);
 border-radius:14px;padding:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.45)}
#bubble[hidden]{display:none}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bhead b{font:700 18px var(--f-display)}
.bx{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:600 14px var(--f-body);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);border-color:transparent}
.news{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.news li{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:8px;background:var(--bg);cursor:pointer;font-size:14px}
.news li::after{content:"›";margin-left:auto;color:var(--muted)}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;white-space:nowrap;text-transform:uppercase}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--gold-soft);color:var(--gold)}
.ev{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:none}
.ev .t{font:500 14px var(--f-num)}
.ev.past{opacity:.55}
.ev.on{background:var(--bad-soft);border-radius:8px;padding:10px 8px;margin:4px 0}
.cur{font:600 12px var(--f-num);padding:1px 6px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.imp{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;text-transform:uppercase}
.imp.High{background:var(--bad-soft);color:var(--bad)}.imp.Medium{background:var(--warn-soft);color:var(--warn)}
.otr{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}.otr:first-of-type{border-top:none}
.otr a{color:var(--gold);font-weight:600;text-decoration:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:5px 0 3px}.bar span{display:block;height:100%;background:var(--gold-hi)}
.dayrow{border-top:1px solid var(--line);padding:8px 0}.dayrow:first-of-type{border-top:none}
.dayrow summary{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;cursor:pointer;font-size:14px}
.dayrow summary .dname{font-weight:700;min-width:84px}.dayrow summary b{margin-left:auto}
.xt{display:flex;flex-direction:column;gap:6px;margin-top:8px}.xr{display:grid;grid-template-columns:1fr 92px 92px;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px}
.xr.win{border-color:var(--good);background:var(--good-soft)}.xn{font-size:14px;font-weight:600}.xc{font-size:13px;text-align:right}.xc .lbl{display:block;font-size:10px}
.rc{display:flex;flex-direction:column;gap:1px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rc:first-child{border-top:none}.rc b{font:500 14px var(--f-num)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:12px;font-size:14.5px;max-width:92%;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold)}
.msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg a,.card a{color:var(--gold)}
.askrow{display:flex;gap:8px;align-items:flex-end}
.askrow textarea{flex:1;font:15px var(--f-body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:44px}
.hl{outline:3px solid var(--gold-hi);outline-offset:3px;border-radius:12px;animation:pulse 1.3s infinite}
@keyframes pulse{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){#robot,#robot *,.hl{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><h1>Forex <span>Trade Bot</span></h1><span class="sym" id="sym">OANDA · demo</span></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="home" aria-selected="true">🏠 Aaj</button>
    <button role="tab" data-view="agents" aria-selected="false">🤖 Agents</button>
    <button role="tab" data-view="journeys" aria-selected="false">🧭 Trades ka safar</button>
    <button role="tab" data-view="charts" aria-selected="false">📈 Charts</button>
    <button role="tab" data-view="closed" aria-selected="false">📒 Band trades</button>
    <button role="tab" data-view="ask" aria-selected="false">💬 Pucho</button>
    <button role="tab" data-view="news" aria-selected="false">📰 News</button>
    <button role="tab" data-view="learn" aria-selected="false">🧠 Seekhna & hisaab</button>
  </div>
</header>
<main id="view" class="wrap"><p class="empty">Bot se data aa raha hai…</p></main>
</div>
<button id="robot" aria-label="Manager robot: khabrein dikhao" data-mood="info">
<svg viewBox="0 0 64 76" width="64" height="76" aria-hidden="true">
 <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D57E"/><stop offset="1" stop-color="#C8901A"/></linearGradient></defs>
 <line x1="32" y1="5" x2="32" y2="14" stroke="#946500" stroke-width="3" stroke-linecap="round"/>
 <circle class="glow" cx="32" cy="5" r="4.5" fill="#3FD69A"/>
 <rect x="7" y="13" width="50" height="36" rx="13" fill="url(#rg)" stroke="#946500" stroke-width="2"/>
 <rect x="13" y="20" width="38" height="21" rx="10" fill="#141A2B"/>
 <g class="eyes"><rect class="eye" x="20" y="25" width="8" height="11" rx="4" fill="#7FE7FF"/><rect class="eye" x="36" y="25" width="8" height="11" rx="4" fill="#7FE7FF"/></g>
 <rect x="17" y="51" width="30" height="16" rx="6" fill="url(#rg)" stroke="#946500" stroke-width="2"/>
 <circle class="glow" cx="32" cy="59" r="3" fill="#3FD69A"/>
 <rect x="5" y="53" width="10" height="5" rx="2.5" fill="#C8901A"/><rect x="49" y="53" width="10" height="5" rx="2.5" fill="#C8901A"/>
 <rect class="leg-l" x="21" y="67" width="8" height="8" rx="2.5" fill="#946500"/><rect class="leg-r" x="35" y="67" width="8" height="8" rx="2.5" fill="#946500"/>
</svg></button>
<div id="bubble" role="dialog" aria-live="polite" hidden></div>
<script>
const FLOW = ['scanner','reader','rules','timer','risk','executor','manager','learner'];
const COUNT_LABELS = {scans:'Scans',charts:'Charts padhe',signals:'Signal mile',checked:'Checks',passed:'Pass hue',
  blocked:'Roke',go:'GO diye',approved:'Approve kiye',orders:'Orders lage',closed:'Trades close',sl_moves:'SL move',
  r_x100:'Kul R',followed:'Results dekhe'};
const FEEDS = {scanner:[],reader:['scanner'],rules:['reader','learner'],timer:['rules','learner','budget','news'],risk:['timer'],
  executor:['risk'],manager:['executor'],learner:['timer','risk','manager'],budget:[],news:[]};
let S = null, route = location.hash.slice(1) || 'home', jfilter = 'all', cfilter = 'all', openJ = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pair = n => String(n || '').replace('_','/');
const money = (x, c) => x == null ? '-' : Number(x).toLocaleString(undefined,{maximumFractionDigits:0}) + (c ? ' ' + c : '');
const px = v => v == null ? '-' : Math.abs(v) >= 1000 ? Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : Number(v).toFixed(Math.abs(v) < 20 ? 5 : 3);
const tfmt = new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false});
const dfmt = new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',day:'numeric',month:'short'});
const nyT = ts => ts ? tfmt.format(new Date(ts*1000)) : '-';
const nyDT = ts => ts ? dfmt.format(new Date(ts*1000)) + ' ' + tfmt.format(new Date(ts*1000)) : '-';
const agent = id => (S?.agents || []).find(a => a.id === id) || {id, emoji:'•', name:id, counts:{}, handoffs:{}, events:[]};
const aname = id => { const a = agent(id); return `${a.emoji} ${a.name}`; };
const countVal = (k, v) => k === 'r_x100' ? (v/100 >= 0 ? '+' : '') + (v/100).toFixed(2) + 'R' : v;

document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.view); });
window.addEventListener('hashchange', () => { route = location.hash.slice(1) || 'home'; render(); if (!BOT.guiding) window.scrollTo(0,0); });
function go(r){ if (location.hash.slice(1) === r) { route = r; render(); } else location.hash = r; }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go]'); if (a) { e.preventDefault(); go(a.dataset.go); return; }
  const j = e.target.closest('[data-ref]'); if (j) { openJ.add(j.dataset.ref); go('journeys'); setTimeout(() => document.getElementById('j-' + CSS.escape(j.dataset.ref))?.scrollIntoView({block:'center'}), 50); }
});

function render(){
  const brainOn = !!(S && S.brain && S.brain.available);
  const askTab = document.querySelector('.tabs [data-view=ask]'); if (askTab) askTab.hidden = !brainOn;
  if (route === 'ask' && S && !brainOn) { route = 'home'; history.replaceState(null, '', '#home'); }
  const base = route.split('/')[0];
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === (base === 'agent' ? 'agents' : base === 'chart' ? 'charts' : base))));
  if (!S) return;
  const sym = $('#sym'); if (sym && S.version) sym.textContent = `OANDA · demo · v${S.version.app} · R${S.version.rules}`;
  const v = $('#view');
  if (base === 'agent') v.innerHTML = viewAgent(route.split('/')[1]);
  else if (base === 'agents') v.innerHTML = viewAgents();
  else if (base === 'journeys') v.innerHTML = viewJourneys();
  else if (base === 'charts') v.innerHTML = viewCharts();
  else if (base === 'chart') v.innerHTML = viewChart(decodeURIComponent(route.split('/')[1] || ''));
  else if (base === 'learn') v.innerHTML = viewLearn();
  else if (base === 'news') v.innerHTML = viewNews();
  else if (base === 'closed') v.innerHTML = viewClosed();
  else if (base === 'ask') { const q = document.getElementById('q')?.value || ''; v.innerHTML = viewAsk(); const t = document.getElementById('q'); if (t) t.value = q; }
  else v.innerHTML = viewHome();
  if (v.querySelector('canvas[data-inst]')) { applyLive(false); drawCharts(); }
  applyHL();
}

  const blocked = st.no_new_trades;
  let cls = 'ok', text = 'Bot chal raha hai · entry window khuli hai', sub = st.session_text || '';
  if (blocked && blocked !== 'outside US session') { cls = 'lock'; text = 'Naye trades band'; sub = blocked; }
  else if (blocked) { cls = 'open'; text = 'Sirf dekh raha hai (US session band)'; sub = st.session_text; }
  return `<div class="status ${cls}"><span class="dot"></span><span>${esc(text)}<small>${esc(sub)} · update ${nyT(st.time)} NY · agla scan ${nyT(st.next_scan)}</small></span></div>`;
}

function amt(v){ if (v == null) return ''; const c = (S.status || {}).currency || '';

function slTpLine(t){
  const slTxt = t.sl_amt == null ? '' : t.sl_amt >= 0 ? `SL lage to bhi <b class="good">+${money(t.sl_amt)} ${S.status.currency}</b> pakka (SL profit mein)` : `SL lage to <b class="bad">−${money(-t.sl_amt)} ${S.status.currency}</b> jayega`;

function liveR(t, price){
  const risk = t.init_stop != null ? Math.abs(t.entry - t.init_stop) : null;
  return risk ? (price - t.entry) * Math.sign(t.units) / risk : null;

function tradeLines(inst){

function draw(cv, ch){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const c = ch.candles || []; if (!c.length) return;
  const lines = tradeLines(ch.instrument);
  let lo = Math.min(...c.map(x => x[3])), hi = Math.max(...c.map(x => x[2]));
  lines.forEach(L => { lo = Math.min(lo, L.v); hi = Math.max(hi, L.v); });
  (ch.ema || []).forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  if (ch.zone) { lo = Math.min(lo, ch.zone[0]); hi = Math.max(hi, ch.zone[1]); }
  const pad = (hi - lo) * .06 || 1; lo -= pad; hi += pad;
  const y = v => h - (v - lo) / (hi - lo) * h, bw = w / c.length;
  if (ch.zone) { g.fillStyle = css('--zone'); g.fillRect(0, y(ch.zone[1]), w, y(ch.zone[0]) - y(ch.zone[1])); }
  c.forEach((k, i) => { const [t,o,hh,l,cl] = k, x = i*bw + bw/2, col = cl >= o ? css('--up') : css('--down');
    g.strokeStyle = col; g.fillStyle = col; g.beginPath(); g.moveTo(x, y(hh)); g.lineTo(x, y(l)); g.stroke();
    g.fillRect(x - Math.max(1, bw*.35), y(Math.max(o, cl)), Math.max(2, bw*.7), Math.max(1, Math.abs(y(o) - y(cl)))); });
  if (ch.ema) { g.strokeStyle = css('--ema'); g.lineWidth = 1.5; g.beginPath(); let s = false;
    ch.ema.forEach((v, i) => { if (v == null) return; const x = i*bw + bw/2; s ? g.lineTo(x, y(v)) : (g.moveTo(x, y(v)), s = true); }); g.stroke(); }
  g.lineWidth = 1.2; g.font = '600 11px system-ui, sans-serif';
  const used = [];
  lines.forEach(L => { g.strokeStyle = L.c; g.fillStyle = L.c; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(0, y(L.v)); g.lineTo(w, y(L.v)); g.stroke();
    g.setLineDash([]); const ly = y(L.v) < 14 ? y(L.v) + 13 : y(L.v) - 3; let lx = 4;
    while (used.some(u => Math.abs(u[1] - ly) < 12 && Math.abs(u[0] - lx) < 150)) lx += 155;   // labels side by side, not on top
    used.push([lx, ly]); g.fillText(L.l + ' ' + px(L.v), lx, ly); });
  const last = c[c.length - 1]; g.fillStyle = css('--ink'); g.font = '600 11px ui-monospace, monospace';
  const txt = px(last[4]); g.fillText(txt, w - g.measureText(txt).width - 2, Math.max(11, Math.min(h - 2, y(last[4]) - 4)));
}

const LIVE = {data:null, busy:false};
const TF_S = {M1:60, M5:300, M15:900, M30:1800, H1:3600, H4:14400, D:86400};
function applyLive(redraw){

      const t0 = Math.floor(L.t / tf) * tf; k.push([t0, last[4], Math.max(last[4], mid), Math.min(last[4], mid), mid]); k.shift();
      if (c.ema) { c.ema.push(c.ema[c.ema.length - 1]); c.ema.shift(); }

  });
  document.querySelectorAll('[data-px]').forEach(el => { const c = (S.charts || []).find(x => x.instrument === el.dataset.px); if (c) el.textContent = px(c.price); });
  document.querySelectorAll('[data-live]').forEach(el => { const p = (L.prices || {})[el.dataset.live]; el.classList.toggle('on', !!(p && p.open)); el.title = p && p.open ? 'Live' : 'Market band'; });
  const ln = document.getElementById('livenote'); if (ln) ln.innerHTML = liveNote();
  ((S.status || {}).open_trades || []).forEach(t => { const el = document.querySelector(`[data-trr="${CSS.escape(String(t.id))}"]`); const p = (L.prices || {})[t.instrument];
    if (!el || !p) return; const r = liveR(t, p.mid); if (r == null) return; el.textContent = (r >= 0 ? '+' : '') + r.toFixed(2) + 'R'; el.className = 'num ' + (r >= 0 ? 'good' : 'bad'); });
  if (redraw) drawCharts();
}
async function tickLive(){
  if (!document.hidden && S && document.querySelector('canvas[data-inst], [data-trr]') && !LIVE.busy) {
    LIVE.busy = true;
    try { const r = await fetch('/api/prices', {cache:'no-store'}); if (r.ok) { LIVE.data = await r.json(); applyLive(true); } } catch (e) {}
    LIVE.busy = false;
  }
  setTimeout(tickLive, 3000);
}
render(); poll(); tickLive();
</script>
