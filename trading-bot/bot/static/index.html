<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trade Bot">
<title>Forex Trade Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#F3F5FA;--surface:#FFFFFF;--ink:#141A2B;--muted:#5B6479;--line:#DDE2EC;--gold:#946500;--gold-hi:#C8901A;
 --gold-soft:#FBF1D9;--on-gold:#FFFFFF;--good:#0F7A55;--good-soft:#DDF3EA;--bad:#C2352B;--bad-soft:#FBE4E1;
 --warn:#9A5B00;--warn-soft:#FBEBD3;--up:#0F9D6B;--down:#D64545;--ema:#7C5CD6;--zone:rgba(200,144,26,.18);
 --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
 --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--surface:#141B2E;--ink:#ECEFF7;--muted:#8E98B2;--line:#25304A;
 --gold:#E9B949;--gold-hi:#F7D57E;--gold-soft:#2E2817;--on-gold:#1A1300;--good:#3FD69A;--good-soft:#11291F;
 --bad:#FF7A6E;--bad-soft:#331917;--warn:#F2B35A;--warn-soft:#30230F;--up:#3FD69A;--down:#FF7A6E;--ema:#A58CF0;--zone:rgba(233,185,73,.2)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
.wrap{display:flex;flex-direction:column;gap:12px}
.app{max-width:1100px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 10px;margin:0 0 6px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{font:700 26px/1 var(--f-display);margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--gold)}
.sym{font:500 12px var(--f-num);color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;white-space:nowrap;font:600 14px var(--f-body);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);border-color:transparent;box-shadow:0 4px 14px -6px var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font:700 20px/1.1 var(--f-display);margin:0 0 8px;letter-spacing:.01em}
h3{font:600 15px var(--f-body);margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.num{font-family:var(--f-num)}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-weight:600}
.status .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.status small{display:block;font-weight:500;opacity:.85;font-size:13px}
.status.ok{background:var(--good-soft);color:var(--good)}
.status.open{background:var(--gold-soft);color:var(--gold)}
.status.lock{background:var(--bad-soft);color:var(--bad)}
.daybar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.daybar div{background:var(--surface);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.daybar b{font:500 17px var(--f-num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.daybar{grid-template-columns:repeat(2,1fr)}}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
/* pipeline */
.flow{display:flex;flex-direction:column;gap:0}
.flow .arrow{height:16px;margin-left:27px;border-left:2px dashed var(--line)}
.agent-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.agent-row:hover{border-color:var(--gold)}
.emo{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--bg);border:1px solid var(--line)}
.agent-row .name{font-weight:600}
.agent-row .st{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tone{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted);vertical-align:1px}
.tone.ok{background:var(--good)}.tone.warn{background:var(--warn)}.tone.bad{background:var(--bad)}.tone.idle{background:var(--line)}
.big{font:500 18px var(--f-num);text-align:right}
.big small{display:block;font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.side-note{font-size:12px;color:var(--muted);margin-left:56px;padding:2px 0}
/* agent cards */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.acard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.acard:hover{border-color:var(--gold)}
.acard .head{display:flex;gap:10px;align-items:center}
.plan{background:var(--gold-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13.5px}
.plan b{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.to{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);cursor:pointer}
/* agent detail */
.back{align-self:flex-start;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:600 14px var(--f-body);cursor:pointer}
.hero{display:flex;gap:12px;align-items:center}
.hero .emo{width:56px;height:56px;font-size:28px}
.hero h2{margin:0}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.tl li:first-child{border-top:none}
.tl .t{font:500 12px var(--f-num);color:var(--muted);padding-top:2px}
.tl .to{font-size:12px;color:var(--gold);font-weight:600}
.tl li.good .txt{color:var(--good)}.tl li.bad .txt{color:var(--bad)}.tl li.warn .txt{color:var(--warn)}
.tl li[data-ref]{cursor:pointer}
.tl li[data-ref] .txt::after{content:"  ›";color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* journeys */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 13px var(--f-body);cursor:pointer}
.seg button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.jcard{display:flex;flex-direction:column;gap:8px}
.jhead{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.b-open{background:var(--gold-soft);color:var(--gold)}.b-block{background:var(--warn-soft);color:var(--warn)}
.b-win{background:var(--good-soft);color:var(--good)}.b-loss{background:var(--bad-soft);color:var(--bad)}.b-run{background:var(--bg);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0 0 0 6px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.steps li{position:relative;padding-left:14px;font-size:14px}
.steps li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.steps li.pass::before{border-color:var(--good);background:var(--good)}
.steps li.block::before{border-color:var(--bad);background:var(--bad)}
.steps li.info::before{border-color:var(--gold)}
.steps .who{font-weight:600}
/* charts */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{border-top:4px solid var(--line)}
.ccard.signal{border-top-color:var(--good)}.ccard.forming{border-top-color:var(--gold-hi)}.ccard.watch{border-top-color:#4c7bd9}
canvas{width:100%;height:150px;display:block;margin:6px 0}
canvas.mini{height:110px}
canvas.big{height:min(60vh,420px)}
.ccard a,.jcard a{color:var(--gold);text-decoration:none;font-weight:600}
.live{font-size:12px;color:var(--muted)}.live.on{color:var(--good);animation:glow2 1.2s ease-in-out infinite}
@keyframes glow2{50%{opacity:.25}}
.cbadge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff;background:var(--muted)}
.signal .cbadge{background:var(--good)}.forming .cbadge{background:var(--gold-hi)}.watch .cbadge{background:#4c7bd9}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv b{font-family:var(--f-num);font-weight:500}
details summary{cursor:pointer;font-weight:600}

/* ---- Manager robot ---- */
.app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#robot{position:fixed;left:0;top:0;z-index:20;width:64px;height:76px;padding:0;border:0;background:none;cursor:pointer;
 transition:transform 1.1s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 6px 10px rgba(0,0,0,.28))}
#robot svg{display:block;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
#robot.walking svg{animation:walk .34s ease-in-out infinite}
#robot.walking .leg-l{animation:legs .34s infinite}#robot.walking .leg-r{animation:legs .34s infinite reverse}
#robot.jump svg{animation:jump .45s ease-in-out 3}
#robot .eyes{animation:blink 4.5s infinite;transform-origin:32px 30px;transform-box:view-box}
#robot .glow{animation:glow 1.6s infinite}
#robot[data-mood="good"] .eye{fill:#3FD69A}#robot[data-mood="bad"] .eye{fill:#FF7A6E}#robot[data-mood="warn"] .eye{fill:#F2B35A}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes walk{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-3px)}}
@keyframes legs{50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes glow{50%{opacity:.3}}
@keyframes jump{50%{transform:translateY(-16px)}}
#bubble{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:19;
 width:min(560px,calc(100% - 24px));max-height:52vh;overflow:auto;background:var(--surface);border:1px solid var(--gold);
 border-radius:14px;padding:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.45)}
#bubble[hidden]{display:none}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bhead b{font:700 18px var(--f-display)}
.bx{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:600 14px var(--f-body);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);border-color:transparent}
.news{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.news li{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:8px;background:var(--bg);cursor:pointer;font-size:14px}
.news li::after{content:"›";margin-left:auto;color:var(--muted)}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;white-space:nowrap;text-transform:uppercase}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--gold-soft);color:var(--gold)}
.ev{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:none}
.ev .t{font:500 14px var(--f-num)}
.ev.past{opacity:.55}
.ev.on{background:var(--bad-soft);border-radius:8px;padding:10px 8px;margin:4px 0}
.cur{font:600 12px var(--f-num);padding:1px 6px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.imp{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;text-transform:uppercase}
.imp.High{background:var(--bad-soft);color:var(--bad)}.imp.Medium{background:var(--warn-soft);color:var(--warn)}
.otr{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}.otr:first-of-type{border-top:none}
.otr a{color:var(--gold);font-weight:600;text-decoration:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:5px 0 3px}.bar span{display:block;height:100%;background:var(--gold-hi)}
.dayrow{border-top:1px solid var(--line);padding:8px 0}.dayrow:first-of-type{border-top:none}
.dayrow summary{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;cursor:pointer;font-size:14px}
.dayrow summary .dname{font-weight:700;min-width:84px}.dayrow summary b{margin-left:auto}
.xt{display:flex;flex-direction:column;gap:6px;margin-top:8px}.xr{display:grid;grid-template-columns:1fr 92px 92px;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px}
.sh .xr{grid-template-columns:1fr 130px}.sh .xc{grid-column:auto!important}
.xr.win{border-color:var(--good);background:var(--good-soft)}.xn{font-size:14px;font-weight:600}.xc{font-size:13px;text-align:right}.xc .lbl{display:block;font-size:10px}
.rc{display:flex;flex-direction:column;gap:1px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rc:first-child{border-top:none}.rc b{font:500 14px var(--f-num)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:12px;font-size:14.5px;max-width:92%;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold)}
.msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg a,.card a{color:var(--gold)}
.askrow{display:flex;gap:8px;align-items:flex-end}
.askrow textarea{flex:1;font:15px var(--f-body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:44px}
.hl{outline:3px solid var(--gold-hi);outline-offset:3px;border-radius:12px;animation:pulse 1.3s infinite}
@keyframes pulse{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){#robot,#robot *,.hl{animation:none!important;transition:none!important}}

/* ---- clean app layout ---- */
header.top{position:static;padding:6px 0 4px}
.brand h1{font-size:22px}
.app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav button{background:none;border:0;color:var(--muted);font:600 12px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;cursor:pointer}
.bnav button span{font-size:20px;line-height:1}
.bnav button.on{color:var(--gold);background:var(--gold-soft)}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mi{display:grid;grid-template-columns:40px 1fr auto 14px;gap:10px;align-items:center;padding:12px 12px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.mi:first-child{border-top:none}
.mi:active,.mi:hover{background:var(--bg)}
.mi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--bg);border:1px solid var(--line)}
.mi .tt{font-weight:600;font-size:15px}.mi .ss{font-size:12.5px;color:var(--muted);margin-top:1px}
.mi .bd{font:600 12px var(--f-num);padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.mi .bd.good{color:var(--good);border-color:var(--good);background:var(--good-soft)}.mi .bd.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.mi .bd.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.mi .ch{color:var(--muted);font-size:18px}
.mgroup{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.phead{display:flex;align-items:center;gap:10px}
.phead .back{padding:6px 10px}
.phead h2{margin:0;font-size:22px}
.phead .sub{font-size:12.5px;color:var(--muted)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.sec>summary{list-style:none;display:grid;grid-template-columns:1fr auto 14px;gap:8px;align-items:center;padding:13px 14px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .st{font-weight:600}details.sec>summary .sm{font-size:12.5px;color:var(--muted);text-align:right}
details.sec>summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(90deg)}
details.sec>.sb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
details.sec>.sb>.card{border:0;padding:0;background:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:500 20px var(--f-num);margin-top:2px}
.status.slim{padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><h1>Forex <span>Trade Bot</span></h1><span class="sym" id="sym">OANDA · demo</span></div>
</header>
<main id="view" class="wrap"><p class="empty">Bot se data aa raha hai…</p></main>
</div>
<nav class="bnav" id="bnav">
  <button data-go="home" data-nav="home"><span>🏠</span>Home</button>
  <button data-go="trades" data-nav="trades"><span>🎯</span>Trades</button>
  <button data-go="charts" data-nav="charts"><span>📈</span>Charts</button>
  <button data-go="menu" data-nav="menu"><span>☰</span>Menu</button>
</nav>
<button id="robot" aria-label="Manager robot: khabrein dikhao" data-mood="info">
<svg viewBox="0 0 64 76" width="64" height="76" aria-hidden="true">
 <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D57E"/><stop offset="1" stop-color="#C8901A"/></linearGradient></defs>
 <line x1="32" y1="5" x2="32" y2="14" stroke="#946500" stroke-width="3" stroke-linecap="round"/>
 <circle class="glow" cx="32" cy="5" r="4.5" fill="#3FD69A"/>
 <rect x="7" y="13" width="50" height="36" rx="13" fill="url(#rg)" stroke="#946500" stroke-width="2"/>
 <rect x="13" y="20" width="38" height="21" rx="10" fill="#141A2B"/>
 <g class="eyes"><rect class="eye" x="20" y="25" width="8" height="11" rx="4" fill="#7FE7FF"/><rect class="eye" x="36" y="25" width="8" height="11" rx="4" fill="#7FE7FF"/></g>
 <rect x="17" y="51" width="30" height="16" rx="6" fill="url(#rg)" stroke="#946500" stroke-width="2"/>
 <circle class="glow" cx="32" cy="59" r="3" fill="#3FD69A"/>
 <rect x="5" y="53" width="10" height="5" rx="2.5" fill="#C8901A"/><rect x="49" y="53" width="10" height="5" rx="2.5" fill="#C8901A"/>
 <rect class="leg-l" x="21" y="67" width="8" height="8" rx="2.5" fill="#946500"/><rect class="leg-r" x="35" y="67" width="8" height="8" rx="2.5" fill="#946500"/>
</svg></button>
<div id="bubble" role="dialog" aria-live="polite" hidden></div>
<script>
const FLOW = ['scanner','reader','rules','timer','risk','executor','manager','learner'];
const COUNT_LABELS = {scans:'Scans',charts:'Charts padhe',signals:'Signal mile',checked:'Checks',passed:'Pass hue',
  blocked:'Roke',go:'GO diye',approved:'Approve kiye',orders:'Orders lage',closed:'Trades close',sl_moves:'SL move',
  r_x100:'Kul R',followed:'Results dekhe'};
const FEEDS = {scanner:[],reader:['scanner'],rules:['reader','learner'],timer:['rules','learner','budget','news'],risk:['timer'],
  executor:['risk'],manager:['executor'],learner:['timer','risk','manager'],budget:[],news:[]};
let S = null, route = location.hash.slice(1) || 'home', jfilter = 'all', cfilter = 'all', openJ = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pair = n => String(n || '').replace('_','/');
const money = (x, c) => x == null ? '-' : Number(x).toLocaleString(undefined,{maximumFractionDigits:0}) + (c ? ' ' + c : '');
const px = v => v == null ? '-' : Math.abs(v) >= 1000 ? Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : Number(v).toFixed(Math.abs(v) < 20 ? 5 : 3);
const tfmt = new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false});
const dfmt = new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',day:'numeric',month:'short'});
const nyT = ts => ts ? tfmt.format(new Date(ts*1000)) : '-';
const dfmtY = new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',day:'numeric',month:'short',year:'numeric'});
const nyDT = ts => { if (!ts) return '-'; const d = new Date(ts*1000);
  return (d.getFullYear() === new Date().getFullYear() ? dfmt.format(d) : dfmtY.format(d)) + ' ' + tfmt.format(d); };
const nyD = ts => ts ? dfmtY.format(new Date(ts*1000)) : '-';
const agent = id => (S?.agents || []).find(a => a.id === id) || {id, emoji:'•', name:id, counts:{}, handoffs:{}, events:[]};
const aname = id => { const a = agent(id); return `${a.emoji} ${a.name}`; };
const countVal = (k, v) => k === 'r_x100' ? (v/100 >= 0 ? '+' : '') + (v/100).toFixed(2) + 'R' : v;

window.addEventListener('hashchange', () => { route = location.hash.slice(1) || 'home'; render(); if (!BOT.guiding) window.scrollTo(0,0); });
function go(r){ if (location.hash.slice(1) === r) { route = r; render(); } else location.hash = r; }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go]'); if (a) { e.preventDefault(); go(a.dataset.go); return; }
  const j = e.target.closest('[data-ref]'); if (j) { openJ.add(j.dataset.ref); go('journeys'); setTimeout(() => document.getElementById('j-' + CSS.escape(j.dataset.ref))?.scrollIntoView({block:'center'}), 50); }
});

function render(){
  const brainOn = !!(S && S.brain && S.brain.available);
  if (route === 'ask' && S && !brainOn) { route = 'home'; history.replaceState(null, '', '#home'); }
  const base = route.split('/')[0];
  document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b.dataset.nav === navKey(base)));
  if (!S) return;
  const sym = $('#sym'); if (sym && S.version) sym.textContent = `OANDA · demo · v${S.version.app} · ${(S.mode || {}).strategy === 'ema_break' ? 'EMA9/15' : 'R' + S.version.rules}`;
  const v = $('#view');
  if (base === 'agent') v.innerHTML = viewAgent(route.split('/')[1]);
  else if (base === 'agents') v.innerHTML = viewAgents();
  else if (base === 'journeys') v.innerHTML = viewJourneys();
  else if (base === 'charts') v.innerHTML = viewCharts();
  else if (base === 'chart') v.innerHTML = viewChart(decodeURIComponent(route.split('/')[1] || ''));
  else if (base === 'learn') v.innerHTML = viewLearn();
  else if (base === 'news') v.innerHTML = viewNews();
  else if (base === 'closed') v.innerHTML = viewClosed();
  else if (base === 'ask') { const q = document.getElementById('q')?.value || ''; v.innerHTML = viewAsk(); const t = document.getElementById('q'); if (t) t.value = q; }
  else if (base === 'menu') v.innerHTML = viewMenu();
  else if (base === 'trades') v.innerHTML = viewTrades();
  else if (base === 'strategy') v.innerHTML = viewStrategy();
  else if (base === 'shadow') v.innerHTML = viewShadow();
  else if (base === 'settings') v.innerHTML = viewSettings();
  else v.innerHTML = viewHome();
  if (v.querySelector('canvas[data-inst]')) { applyLive(false); drawCharts(); }
  applyHL();
}

function statusBanner(st){
  const blocked = st.no_new_trades;
  let cls = 'ok', text = (S.mode || {}).trade_mode === 'all' && (S.mode || {}).strategy === 'ema_break' ? 'Bot chal raha hai · har chart, 24 ghante' : 'Bot chal raha hai · entry window khuli hai', sub = st.session_text || '';
  if (blocked && blocked !== 'outside US session') { cls = 'lock'; text = 'Naye trades band'; sub = blocked; }
  else if (blocked) { cls = 'open'; text = 'Sirf dekh raha hai (US session band)'; sub = st.session_text; }
  const sc = S.scan || {};
  const scanTxt = sc.running ? `🔄 Scan chal raha hai: ${sc.done}/${sc.total} charts` : sc.finished ? `✅ Aakhri scan ${nyT(sc.finished)} NY: ${sc.total} charts, ${sc.signals} signal${sc.failed ? `, ${sc.failed} fail` : ''}` : '';
  return `<div class="status ${cls}"><span class="dot"></span><span>${esc(text)}<small>${scanTxt ? esc(scanTxt) + ' · ' : ''}${st.next_scan ? 'agla scan ' + nyT(st.next_scan) + ' NY' : ''}</small></span></div>${sc.running ? `<div class="bar"><span style="width:${Math.round(100 * sc.done / Math.max(1, sc.total))}%"></span></div>` : ''}`;
}

function todayCard(){
  const T = S.today; if (!T) return '';
  const ccy = (S.status || {}).currency || '';
  return `<div class="card" id="c-today"><div class="row"><h2>📊 Aaj ka hisaab</h2><span class="small muted">${nyDT(T.since)} NY se</span></div>
    <div class="daybar">
      <div><span class="lbl">Aaj khule</span><b>${T.opened}</b></div>
      <div><span class="lbl">Abhi chal rahe</span><b>${T.open_now}</b></div>
      <div><span class="lbl">Band hue</span><b>${T.closed} <span class="small"><span class="good">${T.wins}✅</span> <span class="bad">${T.losses}❌</span>${T.be ? ` ${T.be}➖` : ''}</span></b></div>
      <div><span class="lbl">Band ka P&amp;L</span><b class="${T.pl >= 0 ? 'good' : 'bad'}">${T.pl >= 0 ? '+' : ''}${money(T.pl)} <span class="small">${ccy}</span></b></div>
    </div>
    <div class="small" style="margin-top:6px">Aaj bot ne <b>${T.opened}</b> trade khole, abhi <b>${T.open_now}</b> chal rahe hain. Aaj <b>${T.closed}</b> band hue (inme kal ke khule trade bhi ho sakte hain), kul <b class="${T.r >= 0 ? 'good' : 'bad'}">${T.r >= 0 ? '+' : ''}${T.r.toFixed(2)}R</b>.${T.missing ? ` <b class="warn">${T.missing} trade ka result abhi aa raha hai</b> (bot OANDA se khud laa raha hai, 10 min mein).` : ''}</div>
    <div class="small" style="margin-top:4px"><a href="#charts" data-go="charts" onclick="cfilter='open'" style="color:var(--gold);font-weight:600">🎯 Chal rahe dekho ›</a> · <a href="#closed" data-go="closed" onclick="kperiod='day'" style="color:var(--gold);font-weight:600">📒 Band hue dekho ›</a></div></div>`;
}
function versionCard(){
  const V = S.version || {}, H = (S.learning || {}).rules_history || [];
  return `<div class="card" id="c-version"><h2>🏷️ Version</h2><div class="kv">
    <span>App version</span><b>v${esc(V.app || '?')}</b>
    <span>Code (server pe chal raha)</span><b>${esc(V.build || '-')}</b>
    <span>Rules version</span><b>R${esc(V.rules || 1)}</b>
    <span>Pairs mode</span><b>${(S.learning || {}).universe === 'liquid' ? 'Sirf bade pairs' : 'Saare charts'}</b></div>
    ${H.length ? `<div class="lbl" style="margin-top:8px">Rules kab badle</div><ul class="tl">${H.slice(0, 6).map(h => `<li><span class="t">R${h.v}</span><span>${esc(h.why)} <span class="small muted">· ${nyDT(h.time)}</span></span></li>`).join('')}</ul>` : '<p class="small muted" style="margin:6px 0 0">R1 = shuru wale rules. Bot jab bhi rule ya setting badlega, number badhega aur yahan likha jayega.</p>'}</div>`;
}

function navKey(base){ return base === 'home' ? 'home' : ['trades','closed'].includes(base) ? 'trades' : ['charts','chart'].includes(base) ? 'charts' : 'menu'; }
function pageHead(title, sub, back){
  return `<div class="phead">${back ? `<button class="back" data-go="${back}">‹</button>` : ''}<div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>`;
}
function sec(id, title, summary, body, open){
  return `<details class="sec" id="${id}" ${open ? 'open' : ''}><summary><span class="st">${title}</span><span class="sm">${summary || ''}</span></summary><div class="sb">${body}</div></details>`;
}
function menuItems(){
  const st = S.status || {}, T = S.today || {}, ch = S.charts || [], M = S.mode || {}, L = S.learning || {};
  const n = s => ch.filter(c => c.state === s).length;
  const tr = st.open_trades || [], upl = tr.reduce((a, t) => a + (t.unrealized_pl || 0), 0);
  const N = (S.news || []).filter(e => e.block && e.time > Date.now() / 1000);
  const act = (S.news || []).filter(e => e.active);
  const nr = S.next_review, mins = nr ? Math.max(0, Math.round((nr - Date.now() / 1000) / 60)) : null;
  const ema = M.strategy === 'ema_break';
  const G = M.gate || {};
  const it = (go, ic, tt, ss, bd, cls) => ({go, ic, tt, ss, bd, cls});
  return [
    ['Trading', [
      it('trades', '🎯', 'Chal rahe trades', tr.length ? tr.slice(0, 3).map(t => pair(t.instrument) + (t.units > 0 ? ' BUY' : ' SELL')).join(', ') : 'Abhi koi trade open nahi', tr.length ? `${tr.length} · ${upl >= 0 ? '+' : ''}${money(upl)}` : '0', tr.length ? (upl >= 0 ? 'good' : 'bad') : ''),
      it('closed', '📒', 'Band trades', `Aaj ${T.closed || 0} band · ${T.wins || 0} jeete · ${T.losses || 0} haare`, `${(T.pl || 0) >= 0 ? '+' : ''}${money(T.pl || 0)}`, (T.pl || 0) > 0 ? 'good' : (T.pl || 0) < 0 ? 'bad' : ''),
      it('journeys', '🧭', 'Signals ka safar', 'Har signal kahan pass hua, kahan ruka', String((S.journeys || []).length)),
      it('charts', '📈', 'Charts', (S.scan || {}).running && !ch.length ? `Scan chal raha hai: ${S.scan.done}/${S.scan.total}` : `${n('signal')} signal · ${n('forming')} ban rahe · ${n('watch')} watch`, String(ch.length)),
    ]],
    ['Strategy aur seekhna', [
      it('strategy', '🥇', 'Strategy & backtest', ema ? (M.backtest ? `XAU/USD backtest: unseen ${M.backtest.unseen.n} trades · PF ${M.backtest.unseen.pf ?? '-'}` : (M.gate_progress || {}).running ? 'XAU/USD backtest chal raha hai…' : 'XAU/USD backtest abhi nahi bana') : 'Purani pullback strategy', ema ? (M.trade_mode === 'all' ? '⚡ ON' : G.passed ? '✅ PASS' : '🔒') : '', ema ? (M.trade_mode === 'all' || G.passed ? 'good' : 'warn') : ''),
      ...(ema ? [it('shadow', '🌙', 'Shadow vs asli · Research', (M.research_progress || {}).current ? `Research: ${M.research_progress.done}/${M.research_progress.total} charts ho gaye…` : L.research ? `${L.research.instruments.length} charts ka result · ${L.research.passed.length} pass` : 'Research abhi nahi bana', (M.research_progress || {}).current ? `${Math.round(100 * M.research_progress.done / Math.max(1, M.research_progress.total))}%` : String(((L.trade_list) || []).length) + ' pass')] : []),
      it('learn', '🧠', 'Seekhna', 'Din ka hisaab, sabak, galtiyan, naye rule', mins != null ? `${Math.floor(mins / 60)}h ${mins % 60}m` : ''),
    ]],
    ['Bot ke andar', [
      it('agents', '🤖', 'Agents', 'Har agent kya kar raha hai, kya plan hai', String((S.agents || []).length)),
      it('news', '📰', 'News calendar', act.length ? 'Abhi news ki wajah se kuch pairs band' : N.length ? `Agla: ${N[0].currency} ${N[0].title} ${nyT(N[0].time)} NY` : 'Aage koi bada news nahi', act.length ? '⛔' : N.length ? inTxt(N[0].time) : '', act.length ? 'bad' : ''),
      ...((S.brain || {}).available ? [it('ask', '💬', 'Manager se pucho', 'Market ya bot ke baare mein kuch bhi', '')] : []),
      it('settings', '⚙️', 'Settings & version', `Risk ${(st.risk || {}).risk_per_trade_pct ?? '-'}%/trade · daily limit ${(st.risk || {}).daily_loss_limit_pct ?? '-'}%`, 'v' + ((S.version || {}).app || '?')),
    ]],
  ];
}
function menuList(groups){
  return groups.map(([g, items]) => `<div class="mgroup">${g}</div><div class="menu">${items.map(i => `<button class="mi" data-go="${i.go}"><span class="ic">${i.ic}</span><span><div class="tt">${i.tt}</div><div class="ss">${esc(i.ss)}</div></span>${i.bd ? `<span class="bd ${i.cls || ''}">${esc(i.bd)}</span>` : '<span></span>'}<span class="ch">›</span></button>`).join('')}</div>`).join('');
}
function viewHome(){
  const st = S.status || {}, T = S.today || {}, ccy = st.currency || '';
  const pl = st.nav != null && st.day_start_nav ? st.nav - st.day_start_nav : null;
  return `${statusBanner(st).replace('class="status ', 'class="status slim ')}
  <div class="kpis">
    <div class="kpi"><span class="lbl">Equity</span><b>${money(st.nav)} <span class="small muted">${ccy}</span></b></div>
    <div class="kpi"><span class="lbl">Aaj P&amp;L</span><b class="${pl == null ? '' : pl >= 0 ? 'good' : 'bad'}">${pl == null ? '-' : (pl >= 0 ? '+' : '') + money(pl)}</b></div>
    <div class="kpi"><span class="lbl">Chal rahe</span><b>${(st.open_trades || []).length}</b></div>
    <div class="kpi"><span class="lbl">Aaj band</span><b>${T.closed || 0} <span class="small"><span class="good">${T.wins || 0}✅</span> <span class="bad">${T.losses || 0}❌</span></span></b></div>
  </div>
  ${menuList(menuItems())}`;
}
function viewMenu(){ return pageHead('Menu', 'Sab kuch yahan se khulta hai') + menuList(menuItems()); }
function viewTrades(){
  return `${pageHead('🎯 Trades', 'Chal rahe aur aaj ka hisaab')}
  ${todayCard()}
  ${openList()}
  ${(S.mode || {}).pending && S.mode.pending.length ? `<div class="card"><h2>⏳ Pending stop orders</h2>${S.mode.pending.map(o => `<div class="small">${o.side > 0 ? 'BUY' : 'SELL'} ${esc(pair(o.instrument))} jab price ${px(o.entry)} tode · SL ${px(o.stop)} · TP ${px(o.tp)} · ${nyT(o.expire)} NY tak</div>`).join('')}</div>` : ''}
  <div class="menu"><button class="mi" data-go="closed"><span class="ic">📒</span><span><div class="tt">Saare band trades</div><div class="ss">Jeete / haare / breakeven filter</div></span><span></span><span class="ch">›</span></button></div>`;
}
function variationsCard(){
  const V = (S.mode || {}).variations;
  if (!V) return `<div class="card" id="c-var"><h2>🧪 Variations test</h2><p class="empty">Chal raha hai: targets 1:1.5 se 1:5 × M5 / M15 / H1 / H4 × har ghanta, 2 saal ka data (10–25 min).</p></div>`;
  const cell = c => c && c.n ? `<b class="num ${c.total_r >= 0 ? 'good' : 'bad'}">PF ${c.pf ?? '∞'}</b><br><span class="small muted">${c.total_r >= 0 ? '+' : ''}${c.total_r}R · ${c.n} · ${c.win_pct}%</span>` : '<span class="muted">-</span>';
  const nPass = V.rows.filter(r => r.passed).length;
  return `<div class="card" id="c-var"><div class="row"><h2>🧪 Variations test (${esc(pair(V.instrument))})</h2><span class="small muted">${nyDT(V.made)} NY</span></div>
    <div class="status ${nPass || V.hours_ok.length ? 'ok' : 'lock'}"><span class="dot"></span><span>${nPass ? `✅ ${nPass} combination pass` : '❌ Koi combination pass nahi'}${V.hours_ok.length ? ` · ${V.hours_ok.length} ghante pass` : ' · koi ghanta pass nahi'}<small>Pass = unseen (naya 30%) pe PF 1.2+ aur 30+ trades, aur purane 70% pe bhi PF 1.1+. ${V.tested} cheezein test hui hain, isliye 1-2 ka luck se pass hona mumkin hai.</small></span></div>
    <div class="xt">${V.rows.map(r => `<div class="xr ${r.passed ? 'win' : ''}"><div class="xn">${esc(r.tf)} · 1:${r.rr}${r.passed ? ' <span class="pill good">PASS</span>' : ''}</div>
      <div class="xc"><span class="lbl">Purana 70%</span>${cell(r.tuning)}</div><div class="xc"><span class="lbl">Unseen 30%</span>${cell(r.unseen)}</div></div>`).join('')}</div>
    ${V.hours_ok.length ? `<div class="lbl" style="margin-top:10px">Pass hue ghante (NY time)</div>${V.hours_ok.map(h => `<div class="rc"><span>${esc(h.tf)} · 1:${h.rr} · ${h.hour}:00–${h.hour + 1}:00</span><b class="good">unseen PF ${h.unseen.pf ?? '∞'} · ${h.unseen.n} trades · purana PF ${h.tuning.pf ?? '∞'}</b></div>`).join('')}` : ''}</div>`;
}
function forwardCard(){
  const F = (S.mode || {}).forward || [];
  if (!F.length) return '';
  return F.map(f => { const c = f.card || {};
    return `<div class="card" id="c-fwd"><h2>🔭 Forward test: ${esc(f.timeframe)} · 1:${f.reward_risk} · ${f.charts} charts</h2>
    <p class="small muted" style="margin:0 0 8px">Har chart pe yeh setup <b>live naye data</b> pe follow ho raha hai (sirf shadow, koi order nahi). Shuru: ${nyDT(f.started)} NY. 50+ band setups ke baad hi bharosa karna.</p>
    <div class="kpis"><div class="kpi"><span class="lbl">Band setups</span><b>${c.n || 0}</b></div>
      <div class="kpi"><span class="lbl">Win</span><b>${c.n ? c.win_pct + '%' : '-'}</b></div>
      <div class="kpi"><span class="lbl">Kul R</span><b class="${(c.total_r || 0) >= 0 ? 'good' : 'bad'}">${c.n ? (c.total_r >= 0 ? '+' : '') + c.total_r + 'R' : '-'}</b></div>
      <div class="kpi"><span class="lbl">PF</span><b>${c.n ? (c.pf ?? '∞') : '-'}</b></div></div>
    <div class="small muted" style="margin-top:6px">Abhi chal rahe: ${f.open} · cancel (level nahi tuta): ${f.cancelled}</div>
    ${f.by.length ? `<details style="margin-top:6px"><summary>Chart ke hisaab se (${f.by.length})</summary>${f.by.map(x => `<div class="rc"><span>${esc(pair(x.pair))}</span><b class="${x.total_r >= 0 ? 'good' : 'bad'}">${x.total_r >= 0 ? '+' : ''}${x.total_r}R · ${x.n} setups · win ${x.win_pct}%</b></div>`).join('')}</details>` : ''}
    ${f.recent.length ? `<details style="margin-top:6px"><summary>Aakhri setups</summary>${f.recent.map(x => `<div class="rc"><span>${esc(pair(x.instrument))} · ${nyDT(x.time)} NY · ${x.side > 0 ? 'BUY' : 'SELL'} @ ${px(x.trig)}</span><b class="${x.state === 'done' ? (x.r > 0 ? 'good' : 'bad') : 'muted'}">${x.state === 'done' ? (x.r >= 0 ? '+' : '') + x.r + 'R' : x.state === 'open' ? 'chal raha' : 'cancel'}</b></div>`).join('')}</details>` : '<p class="empty">Abhi koi setup nahi aaya. Har ghante ke candle close pe check hota hai.</p>'}</div>`; }).join('');
}
function viewStrategy(){
  const L = S.learning || {}, st = L.stats_30d || {};
  return pageHead('🥇 Strategy & backtest', '', 'menu') + ((S.mode || {}).strategy === 'ema_break' ? emaCard(false) + forwardCard() + variationsCard() : reportCard(L.report_card, st) + experimentsCard(L.experiments));
}
function viewShadow(){ return pageHead('🌙 Shadow vs asli', 'Aur research: kahan kaam karti hai strategy', 'menu') + shadowCard() + researchCard(); }
function viewSettings(){
  const r = (S.status || {}).risk || {}, b = agent('budget'), params = Object.entries((S.learning || {}).params || {});
  return `${pageHead('⚙️ Settings & version', '', 'menu')}
  ${versionCard()}
  <div class="card"><h2>🛡️ Risk limits</h2><div class="kv">
    <span>Risk per trade</span><b>${r.risk_per_trade_pct ?? '-'}%</b>
    <span>Daily loss limit (open risk ke saath)</span><b>${r.daily_loss_limit_pct ?? '-'}%</b>
    <span>Max drawdown (bot rukega)</span><b>${r.max_drawdown_pct ?? '-'}%</b>
    <span>Max open trades</span><b>${r.max_open_trades ?? '-'}</b>
    <span>Spread SL ke max</span><b>${r.max_spread_to_stop != null ? Math.round(r.max_spread_to_stop * 100) + '%' : '-'}</b></div></div>
  <div class="card"><h2>💰 Paisa aur limits (abhi)</h2><p style="margin:0 0 6px"><span class="tone ${b.tone}"></span>${esc(b.status)}</p><div class="plan">${esc(b.plan)}</div></div>
  ${params.length ? `<div class="card"><h2>⚙️ Bot ne badli settings</h2><div class="kv">${params.map(([k, v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join('')}</div></div>` : ''}`;
}

function flowCard(){
  const rows = FLOW.map((id, i) => {
    const a = agent(id); const c = a.counts || {};
    const key = {scanner:'charts',reader:'signals',rules:'passed',timer:'go',risk:'approved',executor:'orders',manager:'closed',learner:'followed'}[id];
    return `${i ? '<div class="arrow"></div>' : ''}<button class="agent-row" data-go="agent/${id}">

function drawCharts(){
  const byInst = Object.fromEntries((S.charts || []).map(c => [c.instrument, c]));
  document.querySelectorAll('canvas[data-inst]').forEach(cv => { const c = byInst[cv.dataset.inst]; if (c) draw(cv, c); });

function tradeLines(inst){
  return ((S.status || {}).open_trades || []).filter(t => t.instrument === inst).flatMap(t => [
    t.entry != null && {v:t.entry, c:css('--gold-hi'), l:'Entry'},
    t.stop != null && {v:t.stop, c:css('--down'), l:'SL' + (t.sl_amt != null ? ` (${t.sl_amt >= 0 ? '+' : '−'}${money(Math.abs(t.sl_amt))})` : '')},
    t.take_profit != null && {v:t.take_profit, c:css('--up'), l:'TP' + (t.tp_amt != null ? ` (+${money(t.tp_amt)})` : '')}].filter(Boolean));
}
function draw(cv, ch){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const c = ch.candles || []; if (!c.length) return;
  const lines = tradeLines(ch.instrument);
  let lo = Math.min(...c.map(x => x[3])), hi = Math.max(...c.map(x => x[2]));
  lines.forEach(L => { lo = Math.min(lo, L.v); hi = Math.max(hi, L.v); });
  (ch.ema || []).forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  if (ch.zone) { lo = Math.min(lo, ch.zone[0]); hi = Math.max(hi, ch.zone[1]); }
  const pad = (hi - lo) * .06 || 1; lo -= pad; hi += pad;
  const y = v => h - (v - lo) / (hi - lo) * h, bw = w / c.length;
  if (ch.zone) { g.fillStyle = css('--zone'); g.fillRect(0, y(ch.zone[1]), w, y(ch.zone[0]) - y(ch.zone[1])); }
  c.forEach((k, i) => { const [t,o,hh,l,cl] = k, x = i*bw + bw/2, col = cl >= o ? css('--up') : css('--down');
    g.strokeStyle = col; g.fillStyle = col; g.beginPath(); g.moveTo(x, y(hh)); g.lineTo(x, y(l)); g.stroke();
    g.fillRect(x - Math.max(1, bw*.35), y(Math.max(o, cl)), Math.max(2, bw*.7), Math.max(1, Math.abs(y(o) - y(cl)))); });
  if (ch.ema) { g.strokeStyle = css('--ema'); g.lineWidth = 1.5; g.beginPath(); let s = false;
    ch.ema.forEach((v, i) => { if (v == null) return; const x = i*bw + bw/2; s ? g.lineTo(x, y(v)) : (g.moveTo(x, y(v)), s = true); }); g.stroke(); }
  g.lineWidth = 1.2; g.font = '600 11px system-ui, sans-serif';
  const used = [];
  lines.forEach(L => { g.strokeStyle = L.c; g.fillStyle = L.c; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(0, y(L.v)); g.lineTo(w, y(L.v)); g.stroke();
    g.setLineDash([]); const ly = y(L.v) < 14 ? y(L.v) + 13 : y(L.v) - 3; let lx = 4;
    while (used.some(u => Math.abs(u[1] - ly) < 12 && Math.abs(u[0] - lx) < 150)) lx += 155;   // labels side by side, not on top
    used.push([lx, ly]); g.fillText(L.l + ' ' + px(L.v), lx, ly); });
  const last = c[c.length - 1]; g.fillStyle = css('--ink'); g.font = '600 11px ui-monospace, monospace';
  const txt = px(last[4]); g.fillText(txt, w - g.measureText(txt).width - 2, Math.max(11, Math.min(h - 2, y(last[4]) - 4)));
}

/* Everything the robot could mention right now. Each item has a stable key, so once you have

function buildBriefing(){
  const st = S.status || {}, out = [], now = Date.now() / 1000, day = now - 86400;
  const nb = st.no_new_trades;
  if (nb && nb !== 'outside US session') out.push({key:'halt:' + nb, tone:'bad', title:'Naye trades band hain', text: nb, go:'agent/budget', sel:'.hero'});
  (S.agents || []).forEach(a => (a.events || []).forEach(e => { if (e.t > day) { const it = evItem(a.id, e); if (it) out.push(it); } }));
  const tr = st.open_trades || [];
  if (tr.length) { const pl = tr.reduce((s, t) => s + (t.unrealized_pl || 0), 0);
    out.push({key:'open:' + tr.map(t => t.id).sort().join(','), tone: pl >= 0 ? 'good' : 'bad', title: `${tr.length} trade open`, text: `Abhi ${pl >= 0 ? '+' : ''}${money(pl, st.currency)} · ` + tr.map(t => pair(t.instrument) + (t.units > 0 ? ' BUY' : ' SELL')).join(', '), go:'trades', sel:'#c-open-list'}); }
  const blocked = (S.journeys || []).filter(j => j.created > day && !j.taken);
  if (blocked.length) out.push({key:'blocked:' + blocked[0].ref, tone:'info', title:`${blocked.length} signal roke gaye (24 ghante)`, text: 'Kyun roke, har ek ka safar dekho. Time Machine inka result bhi follow kar raha hai.',
    go:'journeys', sel:'#j-' + CSS.escape(blocked[0].ref), prep: () => { jfilter = 'blocked'; openJ.add(blocked[0].ref); }});
  const forming = (S.charts || []).filter(c => c.state === 'forming');
  if (forming.length) out.push({key:'forming:' + forming.map(c => c.instrument).sort().join(','), tone:'info', title:`${forming.length} chart pe setup ban raha hai`, text: forming.slice(0,4).map(c => pair(c.instrument) + (c.bias > 0 ? ' buy' : ' sell')).join(', ') + ' · price entry zone ki taraf aa raha',
    go:'charts', sel:'#c-charts', prep: () => { cfilter = 'forming'; }});
  const N = S.news || [];
  const act = N.filter(e => e.active);
  if (act.length) out.push({key:'nact:' + act.map(e => e.currency + e.time).join(','), tone:'bad', title:'News ki wajah se trades band', text: act.map(e => `${e.currency} ${e.title} ${nyT(e.time)} NY`).join(', ') + ' · in pairs pe abhi naya trade nahi',
    go:'news', sel:'#c-news-now'});
  const soon = N.filter(e => e.block && e.time > now && e.time < now + 24 * 3600);
  if (soon.length) out.push({key:'nsoon:' + soon.map(e => e.currency + e.time).join(','), tone:'info', title:`Agle 24 ghante mein ${soon.length} bada news`, text: soon.slice(0, 3).map(e => `${e.currency} ${e.title} ${nyT(e.time)} NY (${inTxt(e.time)})`).join(' · '),
    go:'news', sel:'#n-' + N.indexOf(soon[0])});
  ((S.brain || {}).briefs || []).filter(b => b.time > day).slice(0, 1).forEach(b => out.push(briefItem(b)));
  const rank = {bad:0, good:1, info:2};
  out.sort((a, b) => rank[a.tone] - rank[b.tone] || (b.t || 0) - (a.t || 0));
  return out;
}

function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^#+\s*(.+)$/gm, '<b>$1</b>').replace(/^\s*[-*]\s+/gm, '• ').replace(/\n/g, '<br>'); }
function srcList(s){ return (s || []).length ? `<div class="small" style="margin-top:6px">Sources: ${s.map((x, i) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${i + 1}. ${esc((x.title || x.url).slice(0, 60))}</a>`).join(' · ')}</div>` : ''; }
function viewAsk(){
  const B = S.brain || {};
  const off = !B.available ? `<div class="status open"><span class="dot"></span><span>Robot ka dimaag abhi band hai: ${esc(B.reason || '')}<small>Chalu karne ke liye Termius mein ek baar: bash ~/himanshubashambu08/trading-bot/deploy/enable-brain.sh (Anthropic API key chahiye, paid).</small></span></div>` : '';
  const briefs = (B.briefs || []).slice(0, 2).map((b, i) => `<div class="card" id="b-${i}"><div class="row"><h2>🌍 World brief</h2><span class="small muted">${nyDT(b.time)} NY</span></div><div class="small">${md(b.text)}</div>${srcList(b.sources)}</div>`).join('');
  const msgs = CHAT.map(m => `<div class="msg ${m.role}">${m.role === 'user' ? esc(m.text) : md(m.text) + srcList(m.sources)}</div>`).join('');
  return `${pageHead('💬 Manager se pucho', '', 'menu')}<div class="card"><h2>💬 Manager se pucho</h2><p class="small muted" style="margin:0">Bot ke baare mein kuch bhi, ya market/duniya ki koi bhi latest baat. Manager bot ka poora data padhta hai aur internet pe khud dhoondhta hai. Woh trade nahi lagata aur settings nahi badalta, sirf jawab deta hai.</p>${off}</div>
  ${briefs}
  <div class="card wrap"><div class="chat" id="chat">${msgs || '<p class="empty">Neeche koi sawaal chuno ya likho.</p>'}${ASKING ? '<div class="msg assistant muted">🤖 Soch raha hai, internet pe dhoondh raha hai…</div>' : ''}</div>
    <div class="chips">${SUGGEST.map(q => `<span class="chip to" data-q="${esc(q)}">${esc(q)}</span>`).join('')}</div>
    <form id="askf" class="askrow"><textarea id="q" rows="2" placeholder="Kuch bhi pucho…" ${ASKING || !B.available ? 'disabled' : ''}></textarea><button class="btn pri" ${ASKING || !B.available ? 'disabled' : ''}>Bhejo</button></form>
    ${CHAT.length ? '<button class="btn" data-clear="1" style="align-self:flex-start">Chat saaf karo</button>' : ''}</div>`;
}
async function ask(q){
  q = (q || '').trim(); if (!q || ASKING || !(S.brain || {}).available) return;
  const history = CHAT.slice(-12).map(m => ({role: m.role, text: m.text}));
  CHAT.push({role:'user', text:q}); ASKING = true; render(); mood('info'); robot.classList.add('walking');
  try {
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:q, history})});
    const a = await r.json(); CHAT.push({role:'assistant', text:a.text, sources:a.sources}); mood(a.error ? 'bad' : 'good');
  } catch (e) { CHAT.push({role:'assistant', text:'Bot server se baat nahi ho payi. Internet/Tailscale check karo.'}); mood('bad'); }
  ASKING = false; robot.classList.remove('walking'); jump();
  CHAT = CHAT.slice(-30); lsSet('tb_chat', JSON.stringify(CHAT)); render();
  setTimeout(() => document.getElementById('chat')?.lastElementChild?.scrollIntoView({block:'start', behavior:'smooth'}), 100);
}
document.addEventListener('submit', e => { if (e.target.id === 'askf') { e.preventDefault(); ask(document.getElementById('q').value); } });
document.addEventListener('keydown', e => { if (e.target.id === 'q' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(e.target.value); } });
document.addEventListener('click', e => {
  const c = e.target.closest('[data-q]'); if (c) ask(c.dataset.q);
  if (e.target.closest('[data-clear]')) { CHAT = []; lsSet('tb_chat', '[]'); render(); }
});
robotHome();
/* ---- live prices: move the last candle with the real price every 3 s ---- */
const LIVE = {data:null, busy:false};
const TF_S = {M1:60, M5:300, M15:900, M30:1800, H1:3600, H4:14400, D:86400};
function applyLive(redraw){
  const L = LIVE.data; if (!L || !S) return;
  const tf = TF_S[(S.status?.timeframes || ['H1'])[0]] || 3600;
  (S.charts || []).forEach(c => {
    const p = (L.prices || {})[c.instrument]; const k = c.candles; if (!p || !k || !k.length) return;
    const mid = p.mid; let last = k[k.length - 1];
    if (p.open && L.t >= last[0] + tf) {                     // a new candle started since the last board refresh
      const t0 = Math.floor(L.t / tf) * tf; k.push([t0, last[4], Math.max(last[4], mid), Math.min(last[4], mid), mid]); k.shift();
      if (c.ema) { c.ema.push(c.ema[c.ema.length - 1]); c.ema.shift(); }
    } else { last[4] = mid; last[2] = Math.max(last[2], mid); last[3] = Math.min(last[3], mid); }
    c.price = mid; c.live = p.open;
  });
  document.querySelectorAll('[data-px]').forEach(el => { const c = (S.charts || []).find(x => x.instrument === el.dataset.px); if (c) el.textContent = px(c.price); });
  document.querySelectorAll('[data-live]').forEach(el => { const p = (L.prices || {})[el.dataset.live]; el.classList.toggle('on', !!(p && p.open)); el.title = p && p.open ? 'Live' : 'Market band'; });
  const ln = document.getElementById('livenote'); if (ln) ln.innerHTML = liveNote();
  ((S.status || {}).open_trades || []).forEach(t => { const el = document.querySelector(`[data-trr="${CSS.escape(String(t.id))}"]`); const p = (L.prices || {})[t.instrument];
    if (!el || !p) return; const r = liveR(t, p.mid); if (r == null) return; el.textContent = (r >= 0 ? '+' : '') + r.toFixed(2) + 'R'; el.className = 'num ' + (r >= 0 ? 'good' : 'bad'); });
  if (redraw) drawCharts();
}
async function tickLive(){
  if (!document.hidden && S && document.querySelector('canvas[data-inst], [data-trr]') && !LIVE.busy) {
    LIVE.busy = true;
    try { const r = await fetch('/api/prices', {cache:'no-store'}); if (r.ok) { LIVE.data = await r.json(); applyLive(true); } } catch (e) {}
    LIVE.busy = false;
  }
  setTimeout(tickLive, 3000);
}
render(); poll(); tickLive();
</script>
