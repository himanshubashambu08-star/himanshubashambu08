<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Video Auto Translator</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>Video Auto Translator</h1>
  </header>

  <label class="row switch">
    <span>Extension ON</span>
    <input type="checkbox" id="enabled">
  </label>
  <label class="row switch">
    <span>Is site par ON (<b id="host">—</b>)</span>
    <input type="checkbox" id="siteEnabled">
  </label>

  <label class="field">
    <span>Meri language (translate karke)</span>
    <select id="targetLang"></select>
  </label>
  <label class="field">
    <span>Output</span>
    <select id="outputMode">
      <option value="subtitles">Subtitles</option>
      <option value="dub">Awaaz (dub)</option>
      <option value="both">Subtitles + Awaaz</option>
    </select>
  </label>

  <div class="status" id="status">Video dhoondh rahe hain…</div>
  <button id="force" class="secondary" hidden>Fir bhi translate karo</button>

  <div id="tabAudioBox" hidden>
    <button id="tabAudio">🎧 Tab audio se translate</button>
    <p class="hint">Protected / iframe wali videos ke liye (Netflix jaise DRM ko chhodkar).</p>
  </div>

  <footer>
    <a href="#" id="openOptions">⚙️ Settings &amp; API key</a>
  </footer>
  <script src="lang.js"></script>
  <script src="popup.js"></script>
</body>
</html>
